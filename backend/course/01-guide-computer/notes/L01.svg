<svg
  width="800"
  height="1200"
  viewBox="0 0 800 1200"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <style>
      .title {
        font-family: Arial, sans-serif;
        font-size: 30px;
        font-weight: 700;
        fill: #1C1B17;
      }

      .subtitle {
        font-family: Arial, sans-serif;
        font-size: 15px;
        font-weight: 400;
        fill: #6E6B63;
      }

      .section {
        font-family: Arial, sans-serif;
        font-size: 17px;
        font-weight: 700;
        fill: #2F5D50;
        letter-spacing: 0.4px;
      }

      .card-title {
        font-family: Arial, sans-serif;
        font-size: 17px;
        font-weight: 700;
        fill: #1C1B17;
      }

      .body {
        font-family: Arial, sans-serif;
        font-size: 14px;
        font-weight: 400;
        fill: #6E6B63;
      }

      .body-dark {
        font-family: Arial, sans-serif;
        font-size: 14px;
        font-weight: 400;
        fill: #1C1B17;
      }

      .small {
        font-family: Arial, sans-serif;
        font-size: 12px;
        font-weight: 400;
        fill: #6E6B63;
      }

      .accent {
        font-family: Arial, sans-serif;
        font-size: 15px;
        font-weight: 700;
        fill: #2F5D50;
      }

      .big-accent {
        font-family: Arial, sans-serif;
        font-size: 18px;
        font-weight: 700;
        fill: #2F5D50;
      }
    </style>
  </defs>

  <!-- ========================================================= -->
  <!-- HEADER -->
  <!-- ========================================================= -->

  <text x="40" y="52" class="title">КОМПЬЮТЕР</text>
  <text x="40" y="78" class="subtitle">КРАТКАЯ ШПАРГАЛКА · ОСНОВЫ</text>

  <line
    x1="40"
    y1="98"
    x2="760"
    y2="98"
    stroke="#9A968C"
    stroke-width="1"
    opacity="0.45"
  />

  <!-- ========================================================= -->
  <!-- WHAT IS COMPUTER -->
  <!-- ========================================================= -->

  <text x="40" y="132" class="section">1 · ЧТО ТАКОЕ КОМПЬЮТЕР?</text>

  <rect
    x="40"
    y="150"
    width="720"
    height="150"
    rx="14"
    fill="#FCFBF8"
    stroke="#2F5D50"
    stroke-width="1.5"
  />

  <text x="65" y="181" class="card-title">
    <tspan>Вычислительная система, которая</tspan>
  </text>

  <text x="65" y="210" class="body-dark">
    <tspan x="65" dy="0">хранит данные</tspan>
    <tspan x="215">•</tspan>
    <tspan x="235">выполняет инструкции</tspan>
  </text>

  <text x="65" y="238" class="body-dark">
    <tspan x="65" dy="0">обрабатывает данные</tspan>
    <tspan x="260">•</tspan>
    <tspan x="280">взаимодействует с внешним миром</tspan>
  </text>

  <line
    x1="65"
    y1="255"
    x2="735"
    y2="255"
    stroke="#9A968C"
    stroke-width="1"
    opacity="0.35"
  />

  <text x="65" y="280" class="small">
    ПК · сервер · смартфон · микроконтроллер · робот
  </text>

  <!-- ========================================================= -->
  <!-- FOUR ROLES -->
  <!-- ========================================================= -->

  <text x="40" y="337" class="section">2 · ЧЕТЫРЕ ОСНОВНЫЕ РОЛИ</text>

  <!-- Program -->
  <rect
    x="40"
    y="355"
    width="345"
    height="125"
    rx="12"
    fill="#FCFBF8"
    stroke="#2F5D50"
    stroke-width="1"
  />

  <text x="62" y="383" class="card-title">ПРОГРАММА</text>

  <text x="62" y="408" class="body">
    <tspan x="62" dy="0">Задаёт, что нужно сделать.</tspan>
    <tspan x="62" dy="21">Содержит инструкции для</tspan>
    <tspan x="62" dy="21">процессора.</tspan>
  </text>

  <!-- CPU -->
  <rect
    x="415"
    y="355"
    width="345"
    height="125"
    rx="12"
    fill="#FCFBF8"
    stroke="#2F5D50"
    stroke-width="1"
  />

  <text x="437" y="383" class="card-title">ПРОЦЕССОР · CPU</text>

  <text x="437" y="408" class="body">
    <tspan x="437" dy="0">Выполняет инструкции.</tspan>
    <tspan x="437" dy="21">Обрабатывает данные</tspan>
    <tspan x="437" dy="21">и изменяет состояние системы.</tspan>
  </text>

  <!-- Memory -->
  <rect
    x="40"
    y="495"
    width="345"
    height="125"
    rx="12"
    fill="#FCFBF8"
    stroke="#2F5D50"
    stroke-width="1"
  />

  <text x="62" y="523" class="card-title">ПАМЯТЬ</text>

  <text x="62" y="548" class="body">
    <tspan x="62" dy="0">Хранит данные, код</tspan>
    <tspan x="62" dy="21">и текущее состояние.</tspan>
    <tspan x="62" dy="21">Регистры · кэш · RAM · накопитель</tspan>
  </text>

  <!-- I/O -->
  <rect
    x="415"
    y="495"
    width="345"
    height="125"
    rx="12"
    fill="#FCFBF8"
    stroke="#2F5D50"
    stroke-width="1"
  />

  <text x="437" y="523" class="card-title">ВВОД / ВЫВОД</text>

  <text x="437" y="548" class="body">
    <tspan x="437" dy="0">Связывает компьютер</tspan>
    <tspan x="437" dy="21">с внешним миром.</tspan>
    <tspan x="437" dy="21">Экран · сеть · датчики · моторы</tspan>
  </text>

  <!-- ========================================================= -->
  <!-- DATA PATH -->
  <!-- ========================================================= -->

  <text x="40" y="660" class="section">3 · ГЛАВНЫЙ ПРИНЦИП: ПУТЬ ДАННЫХ</text>

  <rect
    x="40"
    y="678"
    width="720"
    height="125"
    rx="14"
    fill="#F7F5EF"
    stroke="#9A968C"
    stroke-width="1"
  />

  <text x="65" y="709" class="big-accent">ПОЛУЧИТЬ</text>
  <text x="65" y="735" class="small">ввод / данные</text>

  <line
    x1="180"
    y1="722"
    x2="215"
    y2="722"
    stroke="#2F5D50"
    stroke-width="2"
  />
  <polygon points="215,722 207,717 207,727" fill="#2F5D50"/>

  <text x="235" y="709" class="big-accent">ХРАНИТЬ</text>
  <text x="235" y="735" class="small">память</text>

  <line
    x1="335"
    y1="722"
    x2="370"
    y2="722"
    stroke="#2F5D50"
    stroke-width="2"
  />
  <polygon points="370,722 362,717 362,727" fill="#2F5D50"/>

  <text x="390" y="709" class="big-accent">ОБРАБОТАТЬ</text>
  <text x="390" y="735" class="small">CPU + инструкции</text>

  <line
    x1="545"
    y1="722"
    x2="580"
    y2="722"
    stroke="#2F5D50"
    stroke-width="2"
  />
  <polygon points="580,722 572,717 572,727" fill="#2F5D50"/>

  <text x="600" y="709" class="big-accent">ПЕРЕДАТЬ</text>
  <text x="600" y="735" class="small">результат</text>

  <line
    x1="65"
    y1="762"
    x2="735"
    y2="762"
    stroke="#9A968C"
    stroke-width="1"
    opacity="0.35"
  />

  <text x="65" y="786" class="body-dark">
    Компьютер постоянно перемещает данные между памятью,
  </text>

  <text x="65" y="801" class="body-dark">
    процессором и устройствами ввода/вывода.
  </text>

  <!-- ========================================================= -->
  <!-- MEMORY -->
  <!-- ========================================================= -->

  <text x="40" y="850" class="section">4 · ГДЕ НАХОДЯТСЯ ДАННЫЕ?</text>

  <rect
    x="40"
    y="868"
    width="720"
    height="135"
    rx="14"
    fill="#FCFBF8"
    stroke="#2F5D50"
    stroke-width="1"
  />

  <!-- memory chain -->

  <rect
    x="60"
    y="892"
    width="145"
    height="50"
    rx="9"
    fill="#F7F5EF"
    stroke="#9A968C"
    stroke-width="1"
  />
  <text x="132.5" y="913" text-anchor="middle" class="accent">РЕГИСТРЫ</text>
  <text x="132.5" y="931" text-anchor="middle" class="small">самые быстрые</text>

  <line
    x1="205"
    y1="917"
    x2="225"
    y2="917"
    stroke="#9A968C"
    stroke-width="1.5"
  />

  <rect
    x="225"
    y="892"
    width="145"
    height="50"
    rx="9"
    fill="#F7F5EF"
    stroke="#9A968C"
    stroke-width="1"
  />
  <text x="297.5" y="913" text-anchor="middle" class="accent">КЭШ</text>
  <text x="297.5" y="931" text-anchor="middle" class="small">очень быстрый</text>

  <line
    x1="370"
    y1="917"
    x2="390"
    y2="917"
    stroke="#9A968C"
    stroke-width="1.5"
  />

  <rect
    x="390"
    y="892"
    width="145"
    height="50"
    rx="9"
    fill="#F7F5EF"
    stroke="#9A968C"
    stroke-width="1"
  />
  <text x="462.5" y="913" text-anchor="middle" class="accent">RAM</text>
  <text x="462.5" y="931" text-anchor="middle" class="small">рабочая память</text>

  <line
    x1="535"
    y1="917"
    x2="555"
    y2="917"
    stroke="#9A968C"
    stroke-width="1.5"
  />

  <rect
    x="555"
    y="892"
    width="145"
    height="50"
    rx="9"
    fill="#F7F5EF"
    stroke="#9A968C"
    stroke-width="1"
  />
  <text x="627.5" y="913" text-anchor="middle" class="accent">SSD / HDD</text>
  <text x="627.5" y="931" text-anchor="middle" class="small">долговременное хранение</text>

  <text x="65" y="976" class="body-dark">
    Чем ближе память к CPU → обычно выше скорость и меньше объём.
  </text>

  <!-- ========================================================= -->
  <!-- PROGRAM VS PROCESS -->
  <!-- ========================================================= -->

  <text x="40" y="1044" class="section">5 · ПРОГРАММА ≠ ПРОЦЕСС</text>

  <rect
    x="40"
    y="1062"
    width="345"
    height="108"
    rx="12"
    fill="#FCFBF8"
    stroke="#2F5D50"
    stroke-width="1"
  />

  <text x="62" y="1089" class="card-title">ПРОГРАММА</text>

  <text x="62" y="1113" class="body">
    <tspan x="62" dy="0">Файл с кодом и данными.</tspan>
    <tspan x="62" dy="20">Обычно хранится на SSD/HDD.</tspan>
    <tspan x="62" dy="20">Сам по себе не выполняется.</tspan>
  </text>

  <rect
    x="415"
    y="1062"
    width="345"
    height="108"
    rx="12"
    fill="#FCFBF8"
    stroke="#2F5D50"
    stroke-width="1"
  />

  <text x="437" y="1089" class="card-title">ПРОЦЕСС</text>

  <text x="437" y="1113" class="body">
    <tspan x="437" dy="0">Запущенный экземпляр программы.</tspan>
    <tspan x="437" dy="20">Код + данные + текущее состояние.</tspan>
    <tspan x="437" dy="20">Работает в памяти компьютера.</tspan>
  </text>

  <!-- ========================================================= -->
  <!-- OS -->
  <!-- ========================================================= -->

  <text x="40" y="1215" class="section">6 · ОПЕРАЦИОННАЯ СИСТЕМА</text>

  <!-- This section is intentionally kept inside canvas by shifting -->
  <!-- the final block upward from the nominal section position. -->

</svg>