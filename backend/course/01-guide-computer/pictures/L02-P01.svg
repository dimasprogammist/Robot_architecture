<svg
  width="1200"
  height="500"
  viewBox="0 0 1200 500"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <marker
      id="arrow"
      markerWidth="9"
      markerHeight="9"
      refX="8"
      refY="4.5"
      orient="auto"
    >
      <path
        d="M 0 0 L 9 4.5 L 0 9 Z"
        fill="#2F5D50"
      />
    </marker>

    <style>
      .section {
        font-family: Arial, sans-serif;
        font-size: 16px;
        font-weight: 700;
        fill: #2F5D50;
        letter-spacing: 0.4px;
      }

      .main {
        font-family: Arial, sans-serif;
        font-size: 19px;
        font-weight: 700;
        fill: #1C1B17;
      }

      .secondary {
        font-family: Arial, sans-serif;
        font-size: 13px;
        fill: #6E6B63;
      }

      .arrow-label {
        font-family: Arial, sans-serif;
        font-size: 13px;
        font-weight: 700;
        fill: #2F5D50;
      }
    </style>
  </defs>

  <!-- ===================================================== -->
  <!-- LEFT: SIMPLE MODEL -->
  <!-- ===================================================== -->

  <text
    x="260"
    y="45"
    text-anchor="middle"
    class="section"
  >
    ПРОСТАЯ МОДЕЛЬ
  </text>

  <!-- instruction -->
  <rect
    x="140"
    y="75"
    width="240"
    height="62"
    rx="12"
    fill="#FCFBF8"
    stroke="#2F5D50"
    stroke-width="1.5"
  />

  <text
    x="260"
    y="112"
    text-anchor="middle"
    class="main"
  >
    инструкция
  </text>

  <!-- arrow -->
  <line
    x1="260"
    y1="137"
    x2="260"
    y2="170"
    stroke="#2F5D50"
    stroke-width="2"
    marker-end="url(#arrow)"
  />

  <!-- data -->
  <rect
    x="140"
    y="175"
    width="240"
    height="62"
    rx="12"
    fill="#FCFBF8"
    stroke="#2F5D50"
    stroke-width="1.5"
  />

  <text
    x="260"
    y="212"
    text-anchor="middle"
    class="main"
  >
    данные
  </text>

  <!-- arrow -->
  <line
    x1="260"
    y1="237"
    x2="260"
    y2="270"
    stroke="#2F5D50"
    stroke-width="2"
    marker-end="url(#arrow)"
  />

  <!-- processing -->
  <rect
    x="140"
    y="275"
    width="240"
    height="62"
    rx="12"
    fill="#FCFBF8"
    stroke="#2F5D50"
    stroke-width="1.5"
  />

  <text
    x="260"
    y="312"
    text-anchor="middle"
    class="main"
  >
    обработка
  </text>

  <!-- arrow -->
  <line
    x1="260"
    y1="337"
    x2="260"
    y2="370"
    stroke="#2F5D50"
    stroke-width="2"
    marker-end="url(#arrow)"
  />

  <!-- result -->
  <rect
    x="140"
    y="375"
    width="240"
    height="62"
    rx="12"
    fill="#FCFBF8"
    stroke="#2F5D50"
    stroke-width="1.5"
  />

  <text
    x="260"
    y="412"
    text-anchor="middle"
    class="main"
  >
    результат
  </text>

  <!-- ===================================================== -->
  <!-- TRANSFORMATION ARROW -->
  <!-- ===================================================== -->

  <line
    x1="425"
    y1="250"
    x2="690"
    y2="250"
    stroke="#2F5D50"
    stroke-width="2.5"
    marker-end="url(#arrow)"
  />

  <text
    x="557"
    y="225"
    text-anchor="middle"
    class="arrow-label"
  >
    добавляем память
  </text>

  <text
    x="557"
    y="277"
    text-anchor="middle"
    class="secondary"
  >
    от абстрактного цикла
  </text>

  <text
    x="557"
    y="296"
    text-anchor="middle"
    class="secondary"
  >
    к реальной работе CPU
  </text>

  <!-- ===================================================== -->
  <!-- RIGHT: REALISTIC MODEL -->
  <!-- ===================================================== -->

  <text
    x="950"
    y="45"
    text-anchor="middle"
    class="section"
  >
    БОЛЕЕ ПОЛНАЯ МОДЕЛЬ
  </text>

  <!-- Memory -->
  <rect
    x="820"
    y="75"
    width="260"
    height="70"
    rx="12"
    fill="#FCFBF8"
    stroke="#2F5D50"
    stroke-width="1.5"
  />

  <text
    x="950"
    y="105"
    text-anchor="middle"
    class="main"
  >
    ПАМЯТЬ
  </text>

  <text
    x="950"
    y="127"
    text-anchor="middle"
    class="secondary"
  >
    инструкции · данные · результаты
  </text>

  <!-- instruction arrow -->
  <line
    x1="880"
    y1="145"
    x2="880"
    y2="190"
    stroke="#2F5D50"
    stroke-width="2"
    marker-end="url(#arrow)"
  />

  <text
    x="895"
    y="173"
    class="arrow-label"
  >
    инструкция
  </text>

  <!-- data arrow -->
  <line
    x1="1020"
    y1="145"
    x2="1020"
    y2="190"
    stroke="#2F5D50"
    stroke-width="2"
    marker-end="url(#arrow)"
  />

  <text
    x="1035"
    y="173"
    class="arrow-label"
  >
    данные
  </text>

  <!-- CPU -->
  <rect
    x="820"
    y="195"
    width="260"
    height="100"
    rx="12"
    fill="#FCFBF8"
    stroke="#2F5D50"
    stroke-width="2"
  />

  <text
    x="950"
    y="232"
    text-anchor="middle"
    class="main"
  >
    CPU
  </text>

  <text
    x="950"
    y="257"
    text-anchor="middle"
    class="secondary"
  >
    получает инструкции
  </text>

  <text
    x="950"
    y="278"
    text-anchor="middle"
    class="secondary"
  >
    и обрабатывает данные
  </text>

  <!-- result -->
  <line
    x1="950"
    y1="295"
    x2="950"
    y2="350"
    stroke="#2F5D50"
    stroke-width="2"
    marker-end="url(#arrow)"
  />

  <text
    x="970"
    y="327"
    class="arrow-label"
  >
    результат
  </text>

  <!-- result memory -->
  <rect
    x="820"
    y="355"
    width="260"
    height="70"
    rx="12"
    fill="#F7F5EF"
    stroke="#9A968C"
    stroke-width="1.5"
  />

  <text
    x="950"
    y="385"
    text-anchor="middle"
    class="main"
  >
    ПАМЯТЬ
  </text>

  <text
    x="950"
    y="407"
    text-anchor="middle"
    class="secondary"
  >
    результат сохраняется
  </text>

  <!-- feedback -->
  <path
    d="M 820 390
       L 780 390
       L 780 110
       L 820 110"
    fill="none"
    stroke="#6E6B63"
    stroke-width="1.7"
    marker-end="url(#arrow)"
  />

  <text
    x="755"
    y="250"
    text-anchor="middle"
    class="secondary"
    transform="rotate(-90 755 250)"
  >
    данные снова могут использоваться
  </text>

</svg>