<svg width="900" height="560" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg">

  <rect width="900" height="560" fill="#f4f2ec"/>

  <!-- Заголовок -->
  <text
    x="450" y="58"
    text-anchor="middle"
    font-family="Inter, Arial, sans-serif"
    font-size="28"
    font-weight="600"
    fill="#1c1b17">
    КОМПЬЮТЕР
  </text>

  <!-- ================= PROGRAM ================= -->

  <rect
    x="250" y="95"
    width="400"
    height="105"
    rx="12"
    fill="#fcfbf8"
    stroke="#2F5D50"
    stroke-width="2.5"/>

  <text
    x="450" y="130"
    text-anchor="middle"
    font-family="Inter, Arial, sans-serif"
    font-size="22"
    font-weight="600"
    fill="#2F5D50">
    Программа
  </text>

  <text
    x="450" y="160"
    text-anchor="middle"
    font-family="Inter, Arial, sans-serif"
    font-size="17"
    fill="#6e6b63">
    инструкции + данные
  </text>


  <!-- ================= ARROW PROGRAM → CPU ================= -->

  <line
    x1="450" y1="200"
    x2="450" y2="245"
    stroke="#2F5D50"
    stroke-width="3"/>

  <polygon
    points="442,237 458,237 450,249"
    fill="#2F5D50"/>

  <!-- ================= CPU ================= -->

  <rect
    x="300" y="250"
    width="300"
    height="125"
    rx="14"
    fill="#fcfbf8"
    stroke="#2F5D50"
    stroke-width="3"/>

  <!-- CPU inner chip -->
  <rect
    x="325" y="275"
    width="250"
    height="75"
    rx="8"
    fill="#f7f5ef"
    stroke="#9a968c"
    stroke-width="1.5"/>

  <text
    x="450" y="308"
    text-anchor="middle"
    font-family="Inter, Arial, sans-serif"
    font-size="27"
    font-weight="600"
    fill="#2F5D50">
    CPU
  </text>

  <text
    x="450" y="336"
    text-anchor="middle"
    font-family="Inter, Arial, sans-serif"
    font-size="16"
    fill="#6e6b63">
    выполняет инструкции
  </text>

  <!-- ================= BRANCH ================= -->

  <line
    x1="450" y1="375"
    x2="450" y2="405"
    stroke="#6e6b63"
    stroke-width="2.5"/>

  <line
    x1="200" y1="405"
    x2="700" y2="405"
    stroke="#6e6b63"
    stroke-width="2.5"/>

  <!-- Left branch -->
  <line
    x1="200" y1="405"
    x2="200" y2="435"
    stroke="#6e6b63"
    stroke-width="2.5"/>

  <polygon
    points="192,427 208,427 200,439"
    fill="#6e6b63"/>

  <!-- Right branch -->
  <line
    x1="700" y1="405"
    x2="700" y2="435"
    stroke="#6e6b63"
    stroke-width="2.5"/>

  <polygon
    points="692,427 708,427 700,439"
    fill="#6e6b63"/>

  <!-- ================= RAM ================= -->

  <rect
    x="65" y="440"
    width="270"
    height="90"
    rx="12"
    fill="#fcfbf8"
    stroke="#2F5D50"
    stroke-width="2.5"/>

  <text
    x="200" y="475"
    text-anchor="middle"
    font-family="Inter, Arial, sans-serif"
    font-size="23"
    font-weight="600"
    fill="#2F5D50">
    Память
  </text>

  <text
    x="200" y="503"
    text-anchor="middle"
    font-family="Inter, Arial, sans-serif"
    font-size="17"
    fill="#6e6b63">
    RAM / SSD
  </text>

  <!-- ================= I/O ================= -->

  <rect
    x="565" y="440"
    width="270"
    height="90"
    rx="12"
    fill="#fcfbf8"
    stroke="#2F5D50"
    stroke-width="2.5"/>

  <text
    x="700" y="475"
    text-anchor="middle"
    font-family="Inter, Arial, sans-serif"
    font-size="23"
    font-weight="600"
    fill="#2F5D50">
    Ввод-вывод
  </text>

  <text
    x="700" y="503"
    text-anchor="middle"
    font-family="Inter, Arial, sans-serif"
    font-size="16"
    fill="#6e6b63">
    сеть · экран · датчики · моторы
  </text>

</svg>