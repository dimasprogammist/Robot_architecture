  <text x="605" y="271"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="23"
        fill="#1C1B17">
    +
  </text>

  <!-- ===== ЧЕТВЁРТОЕ КОЛЕБАНИЕ ===== -->

  <text x="690" y="205"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="15"
