    stroke-linecap="round"/>

  <!-- ===== НИЖНЯЯ ФОРМУЛА ===== -->

  <text x="400" y="350"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="16"
        fill="#6E6B63">
