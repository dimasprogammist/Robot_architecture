  </text>

  <!-- ===== ПЕРВОЕ КОЛЕБАНИЕ ===== -->

  <text x="505" y="48"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="15"
        fill="#1C1B17">
    простое колебание 1
  </text>

  <line x1="425" y1="105" x2="585" y2="105"
