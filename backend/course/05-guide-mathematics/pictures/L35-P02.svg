<svg xmlns="http://www.w3.org/2000/svg"
     width="800"
     height="450"
     viewBox="0 0 800 450">

  <rect x="0" y="0" width="800" height="450" fill="#F4F2EC"/>

  <!-- ===== СЛОЖНЫЙ СИГНАЛ ===== -->

  <text x="200" y="48"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="17"
        fill="#1C1B17">
    сложный сигнал
  </text>

  <!-- оси -->
  <line x1="55" y1="150" x2="345" y2="150"
        stroke="#6E6B63" stroke-width="1.5"/>
  <line x1="55" y1="80" x2="55" y2="220"
        stroke="#6E6B63" stroke-width="1.5"/>

  <!-- стрелки -->
  <path d="M345 150 L337 146 L337 154 Z" fill="#6E6B63"/>
  <path d="M55 80 L51 88 L59 88 Z" fill="#6E6B63"/>

  <!-- нулевая линия -->
  <line x1="55" y1="150" x2="345" y2="150"
        stroke="#9A968C"
        stroke-width="0.8"
        opacity="0.45"/>

  <!--
    Сложный сигнал.
    Он является суммой:
    sin(t) + 0.5 sin(3t) + 0.3 cos(5t)
  -->
  <path
    d="M55 150
       C62 126 69 108 76 105
       C83 102 90 115 97 132
       C104 149 111 157 118 151
       C125 145 132 123 139 106
       C146 89 153 88 160 101
       C167 114 174 139 181 149
       C188 159 195 155 202 144
       C209 133 216 112 223 101
       C230 90 237 97 244 113
       C251 129 258 151 265 157
       C272 163 279 151 286 134
       C293 117 300 102 307 105
       C314 108 321 125 328 141
       C335 157 340 157 345 150"
    fill="none"
    stroke="#2F5D50"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- ===== РАЗДЕЛИТЕЛЬ ===== -->

  <text x="380" y="155"
        text-anchor="middle"
        font-family="Arial, sans-serif"
