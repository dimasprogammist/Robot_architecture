<svg xmlns="http://www.w3.org/2000/svg"
     width="800"
     height="450"
     viewBox="0 0 800 450">

  <!-- Фон -->
  <rect x="0" y="0" width="800" height="450" fill="#F4F2EC"/>

  <!-- Заголовок -->
  <text x="400"
        y="55"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="18"
        fill="#1C1B17">
    Нормальное распределение
  </text>

  <!-- =========================================================
       КООРДИНАТНЫЕ ОСИ
       ========================================================= -->

  <!-- Ось X -->
  <line x1="85" y1="350"
        x2="725" y2="350"
        stroke="#6E6B63"
        stroke-width="1.5"/>

  <!-- Ось Y -->
  <line x1="85" y1="350"
        x2="85" y2="95"
        stroke="#6E6B63"
        stroke-width="1.5"/>

  <!-- Стрелка X -->
  <path d="M725 350 L715 345 L715 355 Z"
        fill="#6E6B63"/>

  <!-- Стрелка Y -->
  <path d="M85 95 L80 105 L90 105 Z"
        fill="#6E6B63"/>

  <!-- =========================================================
       СЛАБКАЯ СЕТКА
       ========================================================= -->

  <line x1="245" y1="350"
        x2="245" y2="115"
        stroke="#9A968C"
        stroke-width="0.7"
        opacity="0.28"/>

  <line x1="405" y1="350"
        x2="405" y2="105"
        stroke="#9A968C"
        stroke-width="0.7"
        opacity="0.28"/>

  <line x1="565" y1="350"
        x2="565" y2="115"
        stroke="#9A968C"
        stroke-width="0.7"
        opacity="0.28"/>

  <line x1="85" y1="270"
        x2="725" y2="270"
        stroke="#9A968C"
        stroke-width="0.7"
        opacity="0.28"/>

  <line x1="85" y1="190"
        x2="725" y2="190"
        stroke="#9A968C"
        stroke-width="0.7"
        opacity="0.28"/>

  <line x1="85" y1="110"
        x2="725" y2="110"
        stroke="#9A968C"
        stroke-width="0.7"
        opacity="0.28"/>

  <!-- =========================================================
       КРИВА НОРМАЛЬНОГО РАСПРЕДЕЛЕНИЯ
       
       f(x) = 1 / sqrt(2π) * exp(-x² / 2)

       μ = 0
       σ = 1
       ========================================================= -->

  <path
    d="
      M105 347
      C125 345, 145 342, 165 335
      C185 328, 205 316, 225 299
      C245 282, 265 260, 285 234
      C305 208, 325 177, 345 148
      C365 119, 385 99, 405 94
      C425 99, 445 119, 465 148
      C485 177, 505 208, 525 234
      C545 260, 565 282, 585 299
      C605 316, 625 328, 645 335
      C665 342, 685 345, 705 347"
    fill="none"
    stroke="#2F5D50"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- =========================================================
       СРЕДНЕЕ μ
       ========================================================= -->

  <line x1="405" y1="350"
        x2="405" y2="94"
        stroke="#2F5D50"
        stroke-width="1.5"
        stroke-dasharray="6 5"
        opacity="0.75"/>

  <!-- Точка максимума -->
  <circle cx="405" cy="94"
          r="5"
          fill="#2F5D50"/>

  <!-- Подпись μ -->
  <text x="405"
        y="378"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17"
        fill="#2F5D50">
    μ
  </text>

  <!-- Подпись оси X -->
  <text x="715"
        y="380"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15"
        fill="#6E6B63">
    значение
  </text>

  <!-- Подпись оси Y -->
  <text x="70"
        y="105"
        text-anchor="end"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15"
        fill="#6E6B63">
    вероятность
  </text>

  <!-- =========================================================
       ДЕЛЕНИЯ НА ОСИ X
       ========================================================= -->

  <g stroke="#6E6B63" stroke-width="1">

    <line x1="245" y1="350" x2="245" y2="357"/>
    <line x1="325" y1="350" x2="325" y2="357"/>
    <line x1="405" y1="350" x2="405" y2="357"/>
    <line x1="485" y1="350" x2="485" y2="357"/>
    <line x1="565" y1="350" x2="565" y2="357"/>

  </g>

  <!-- Значения -->
  <g font-family="Arial, Helvetica, sans-serif"
     font-size="13"
     fill="#6E6B63"
     text-anchor="middle">

    <text x="245" y="375">−2</text>
    <text x="325" y="375">−1</text>
    <text x="405" y="375">0</text>
    <text x="485" y="375">1</text>
    <text x="565" y="375">2</text>

  </g>

</svg>