<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 800 450"
     width="800"
     height="450">

  <!-- Фон приложения -->
  <rect x="0" y="0" width="800" height="450" fill="#F4F2EC"/>

  <!--
    Область графика:
    x = 0..10  →  80..740
    y = 0..10  →  400..40
  -->

  <!-- Сетка -->
  <g stroke="#9A968C" stroke-width="0.7" opacity="0.25">

    <!-- Вертикальные линии -->
    <line x1="80"  y1="40" x2="80"  y2="400"/>
    <line x1="146" y1="40" x2="146" y2="400"/>
    <line x1="212" y1="40" x2="212" y2="400"/>
    <line x1="278" y1="40" x2="278" y2="400"/>
    <line x1="344" y1="40" x2="344" y2="400"/>
    <line x1="410" y1="40" x2="410" y2="400"/>
    <line x1="476" y1="40" x2="476" y2="400"/>
    <line x1="542" y1="40" x2="542" y2="400"/>
    <line x1="608" y1="40" x2="608" y2="400"/>
    <line x1="674" y1="40" x2="674" y2="400"/>
    <line x1="740" y1="40" x2="740" y2="400"/>

    <!-- Горизонтальные линии -->
    <line x1="80" y1="400" x2="740" y2="400"/>
    <line x1="80" y1="364" x2="740" y2="364"/>
    <line x1="80" y1="328" x2="740" y2="328"/>
    <line x1="80" y1="292" x2="740" y2="292"/>
    <line x1="80" y1="256" x2="740" y2="256"/>
    <line x1="80" y1="220" x2="740" y2="220"/>
    <line x1="80" y1="184" x2="740" y2="184"/>
    <line x1="80" y1="148" x2="740" y2="148"/>
    <line x1="80" y1="112" x2="740" y2="112"/>
    <line x1="80" y1="76"  x2="740" y2="76"/>
    <line x1="80" y1="40"  x2="740" y2="40"/>

  </g>

  <!-- Оси координат -->
  <g stroke="#6E6B63" stroke-width="1.4" fill="none">

    <!-- X -->
    <line x1="80" y1="400" x2="755" y2="400"/>

    <!-- Y -->
    <line x1="80" y1="400" x2="80" y2="32"/>

  </g>

  <!-- Стрелки осей -->
  <g fill="#6E6B63">

    <polygon points="755,400 745,395 745,405"/>

    <polygon points="80,32 75,42 85,42"/>

  </g>

  <!-- Подписи осей -->
  <g fill="#1C1B17"
     font-family="Arial, Helvetica, sans-serif"
     font-size="16"
     font-style="italic">

    <text x="762" y="405">x</text>

    <text x="86" y="27">y</text>

  </g>

  <!-- Начало координат -->
  <text x="68"
        y="418"
        fill="#6E6B63"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14">
    O
  </text>

  <!-- Подписи основных делений -->
  <g fill="#6E6B63"
     font-family="Arial, Helvetica, sans-serif"
     font-size="12"
     text-anchor="middle">

    <text x="146" y="418">1</text>
    <text x="212" y="418">2</text>
    <text x="278" y="418">3</text>
    <text x="344" y="418">4</text>
    <text x="410" y="418">5</text>
    <text x="476" y="418">6</text>
    <text x="542" y="418">7</text>
    <text x="608" y="418">8</text>
    <text x="674" y="418">9</text>
    <text x="740" y="418">10</text>

  </g>

  <g fill="#6E6B63"
     font-family="Arial, Helvetica, sans-serif"
     font-size="12"
     text-anchor="end">

    <text x="72" y="404">0</text>
    <text x="72" y="368">1</text>
    <text x="72" y="332">2</text>
    <text x="72" y="296">3</text>
    <text x="72" y="260">4</text>
    <text x="72" y="224">5</text>
    <text x="72" y="188">6</text>
    <text x="72" y="152">7</text>
    <text x="72" y="116">8</text>
    <text x="72" y="80">9</text>
    <text x="72" y="44">10</text>

  </g>

  <!--
    x + y = 10
    y = 10 - x

    От (0,10) до (10,0)
  -->
  <line x1="80"
        y1="40"
        x2="740"
        y2="400"
        stroke="#2F5D50"
        stroke-width="2.8"
        stroke-linecap="round"/>

  <!--
    x - y = 2
    y = x - 2

    От (2,0) до (10,8)
  -->
  <line x1="212"
        y1="400"
        x2="740"
        y2="112"
        stroke="#2F5D50"
        stroke-width="2.8"
        stroke-linecap="round"/>

  <!-- Точка пересечения (6,4) -->
  <circle cx="476"
          cy="256"
          r="5.5"
          fill="#2F5D50"/>

  <!-- Подпись точки -->
  <text x="465"
        y="240"
        fill="#1C1B17"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15">
    (6, 4)
  </text>

  <!-- Подпись первой функции -->
  <text x="605"
        y="310"
        fill="#2F5D50"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15"
        font-style="italic"
        transform="rotate(28.6 605 310)">
    x + y = 10
  </text>

  <!-- Подпись второй функции -->
  <text x="300"
        y="340"
        fill="#2F5D50"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15"
        font-style="italic"
        transform="rotate(-28.6 300 340)">
    x − y = 2
  </text>

</svg>