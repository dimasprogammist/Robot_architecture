<svg xmlns="http://www.w3.org/2000/svg"
     width="800"
     height="450"
     viewBox="0 0 800 450">

  <rect width="800" height="450" fill="#F4F2EC"/>

  <!-- =========================================================
       ЛЕВАЯ ЧАСТЬ — непрерывный сигнал
       ========================================================= -->

  <text x="200"
        y="55"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17"
        fill="#1C1B17">
    непрерывный сигнал
  </text>

  <!-- Оси -->
  <line x1="55" y1="230" x2="350" y2="230"
        stroke="#6E6B63"
        stroke-width="1.5"/>

  <line x1="55" y1="360" x2="55" y2="95"
        stroke="#6E6B63"
        stroke-width="1.5"/>

  <!-- Стрелки осей -->
  <path d="M350 230 L342 226 L342 234 Z"
        fill="#6E6B63"/>

  <path d="M55 95 L51 103 L59 103 Z"
        fill="#6E6B63"/>

  <!-- Слабая центральная линия -->
  <line x1="55" y1="230" x2="350" y2="230"
        stroke="#9A968C"
        stroke-width="0.7"
        opacity="0.45"/>

  <!--
    Непрерывный сигнал:
    y = sin(x) в масштабе изображения.
    Кривая построена по точным вычисленным значениям.
  -->
  <path d="
    M55 230
    C64 199, 73 170, 82 151
    C91 132, 100 126, 109 133
    C118 140, 127 160, 136 184
    C145 208, 154 230, 163 230
    C172 230, 181 208, 190 184
    C199 160, 208 140, 217 133
    C226 126, 235 132, 244 151
    C253 170, 262 199, 271 230
    C280 261, 289 290, 298 309
    C307 328, 316 334, 325 327
    C334 320, 343 300, 350 276"
    fill="none"
    stroke="#2F5D50"
    stroke-width="3.2"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- =========================================================
       ПРАВАЯ ЧАСТЬ — дискретизированный сигнал
       ========================================================= -->

  <text x="600"
        y="55"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17"
        fill="#1C1B17">
    дискретизированный сигнал
  </text>

  <!-- Оси -->
  <line x1="455" y1="230" x2="750" y2="230"
        stroke="#6E6B63"
        stroke-width="1.5"/>

  <line x1="455" y1="360" x2="455" y2="95"
        stroke="#6E6B63"
        stroke-width="1.5"/>

  <!-- Стрелки осей -->
  <path d="M750 230 L742 226 L742 234 Z"
        fill="#6E6B63"/>

  <path d="M455 95 L451 103 L459 103 Z"
        fill="#6E6B63"/>

  <!-- Центральная линия -->
  <line x1="455" y1="230" x2="750" y2="230"
        stroke="#9A968C"
        stroke-width="0.7"
        opacity="0.45"/>

  <!--
    Равные интервалы измерения.
    Каждый вертикальный штрих показывает момент измерения.
  -->

  <g stroke="#9A968C"
     stroke-width="0.9"
     opacity="0.45">

    <line x1="470" y1="230" x2="470" y2="174"/>
    <line x1="495" y1="230" x2="495" y2="140"/>
    <line x1="520" y1="230" x2="520" y2="128"/>
    <line x1="545" y1="230" x2="545" y2="141"/>
    <line x1="570" y1="230" x2="570" y2="175"/>
    <line x1="595" y1="230" x2="595" y2="230"/>
    <line x1="620" y1="230" x2="620" y2="285"/>
    <line x1="645" y1="230" x2="645" y2="320"/>
    <line x1="670" y1="230" x2="670" y2="332"/>
    <line x1="695" y1="230" x2="695" y2="319"/>
    <line x1="720" y1="230" x2="720" y2="285"/>
  </g>

  <!-- Точки измерений -->
  <g fill="#2F5D50">

    <circle cx="470" cy="174" r="5"/>
    <circle cx="495" cy="140" r="5"/>
    <circle cx="520" cy="128" r="5"/>
    <circle cx="545" cy="141" r="5"/>
    <circle cx="570" cy="175" r="5"/>
    <circle cx="595" cy="230" r="5"/>
    <circle cx="620" cy="285" r="5"/>
    <circle cx="645" cy="320" r="5"/>
    <circle cx="670" cy="332" r="5"/>
    <circle cx="695" cy="319" r="5"/>
    <circle cx="720" cy="285" r="5"/>

  </g>

  <!-- Небольшие деления времени -->
  <g stroke="#6E6B63" stroke-width="1">

    <line x1="470" y1="230" x2="470" y2="236"/>
    <line x1="495" y1="230" x2="495" y2="236"/>
    <line x1="520" y1="230" x2="520" y2="236"/>
    <line x1="545" y1="230" x2="545" y2="236"/>
    <line x1="570" y1="230" x2="570" y2="236"/>
    <line x1="595" y1="230" x2="595" y2="236"/>
    <line x1="620" y1="230" x2="620" y2="236"/>
    <line x1="645" y1="230" x2="645" y2="236"/>
    <line x1="670" y1="230" x2="670" y2="236"/>
    <line x1="695" y1="230" x2="695" y2="236"/>
    <line x1="720" y1="230" x2="720" y2="236"/>

  </g>

  <!-- Подписи осей -->
  <text x="343"
        y="252"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15"
        fill="#6E6B63">
    t
  </text>

  <text x="44"
        y="102"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15"
        fill="#6E6B63">
    y
  </text>

  <text x="743"
        y="252"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15"
        fill="#6E6B63">
    t
  </text>

  <text x="444"
        y="102"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15"
        fill="#6E6B63">
    y
  </text>

  <!-- Равные интервалы -->
  <text x="607"
        y="365"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14"
        fill="#6E6B63">
    равные интервалы времени
  </text>

  <!-- Связующая стрелка между представлениями -->
  <path d="M380 230 L420 230"
        stroke="#9A968C"
        stroke-width="1.2"/>

  <path d="M420 230 L412 226 L412 234 Z"
        fill="#9A968C"/>

</svg>