<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 800 450"
     width="800"
     height="450">

  <defs>
    <marker id="arrow"
            viewBox="0 0 10 10"
            refX="8"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z"
            fill="#2F5D50"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#F4F2EC"/>

  <!-- ========================================================= -->
  <!-- PANEL 1 — TOO SMALL -->
  <!-- ========================================================= -->

  <g>
    <!-- Title -->
    <text x="133"
          y="42"
          text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="18"
          fill="#1C1B17">
      Слишком маленький шаг
    </text>

    <!-- Coordinate area -->
    <line x1="38" y1="250"
          x2="228" y2="250"
          stroke="#6E6B63"
          stroke-width="1.4"
          marker-end="url(#arrow)"/>

    <line x1="133" y1="285"
          x2="133" y2="85"
          stroke="#6E6B63"
          stroke-width="1.4"
          marker-end="url(#arrow)"/>

    <!-- Subtle grid -->
    <g stroke="#9A968C"
       stroke-width="0.7"
       opacity="0.25">
      <line x1="55" y1="220" x2="211" y2="220"/>
      <line x1="55" y1="190" x2="211" y2="190"/>
      <line x1="55" y1="160" x2="211" y2="160"/>
      <line x1="55" y1="130" x2="211" y2="130"/>

      <line x1="75" y1="105" x2="75" y2="250"/>
      <line x1="105" y1="105" x2="105" y2="250"/>
      <line x1="161" y1="105" x2="161" y2="250"/>
      <line x1="191" y1="105" x2="191" y2="250"/>
    </g>

    <!-- Convex loss function -->
    <path d="
      M 55 125
      C 75 145, 90 190, 105 220
      C 117 244, 126 250, 133 250
      C 140 250, 149 244, 161 220
      C 176 190, 191 145, 211 125"
      fill="none"
      stroke="#2F5D50"
      stroke-width="3"
      stroke-linecap="round"/>

    <!-- Optimization path -->
    <polyline
      points="
        70,155
        76,166
        82,177
        88,188
        94,198
        100,207
        106,215
        112,222"
      fill="none"
      stroke="#2F5D50"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"/>

    <!-- Steps -->
    <g fill="#2F5D50">
      <circle cx="70" cy="155" r="4.5"/>
      <circle cx="76" cy="166" r="4.5"/>
      <circle cx="82" cy="177" r="4.5"/>
      <circle cx="88" cy="188" r="4.5"/>
      <circle cx="94" cy="198" r="4.5"/>
      <circle cx="100" cy="207" r="4.5"/>
      <circle cx="106" cy="215" r="4.5"/>
      <circle cx="112" cy="222" r="4.5"/>
    </g>

    <!-- Direction arrow -->
    <line x1="82" y1="177"
          x2="99" y2="206"
          stroke="#2F5D50"
          stroke-width="2"
          marker-end="url(#arrow)"/>

    <!-- Axis labels -->
    <text x="220" y="267"
          font-family="Arial, Helvetica, sans-serif"
          font-size="15"
          fill="#6E6B63">x</text>

    <text x="143" y="94"
          font-family="Arial, Helvetica, sans-serif"
          font-size="15"
          fill="#6E6B63">L</text>
  </g>


  <!-- ========================================================= -->
  <!-- PANEL 2 — GOOD -->
  <!-- ========================================================= -->

  <g>
    <!-- Title -->
    <text x="400"
          y="42"
          text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="18"
          fill="#1C1B17">
      Хороший шаг
    </text>

    <!-- Coordinate area -->
    <line x1="305" y1="250"
          x2="495" y2="250"
          stroke="#6E6B63"
          stroke-width="1.4"
          marker-end="url(#arrow)"/>

    <line x1="400" y1="285"
          x2="400" y2="85"
          stroke="#6E6B63"
          stroke-width="1.4"
          marker-end="url(#arrow)"/>

    <!-- Subtle grid -->
    <g stroke="#9A968C"
       stroke-width="0.7"
       opacity="0.25">
      <line x1="322" y1="220" x2="478" y2="220"/>
      <line x1="322" y1="190" x2="478" y2="190"/>
      <line x1="322" y1="160" x2="478" y2="160"/>
      <line x1="322" y1="130" x2="478" y2="130"/>

      <line x1="342" y1="105" x2="342" y2="250"/>
      <line x1="372" y1="105" x2="372" y2="250"/>
      <line x1="428" y1="105" x2="428" y2="250"/>
      <line x1="458" y1="105" x2="458" y2="250"/>
    </g>

    <!-- Convex loss function -->
    <path d="
      M 322 125
      C 342 145, 357 190, 372 220
      C 384 244, 393 250, 400 250
      C 407 250, 416 244, 428 220
      C 443 190, 458 145, 478 125"
      fill="none"
      stroke="#2F5D50"
      stroke-width="3"
      stroke-linecap="round"/>

    <!-- Optimization path -->
    <polyline
      points="
        338,151
        365,203
        387,238
        398,249"
      fill="none"
      stroke="#2F5D50"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"/>

    <!-- Steps -->
    <g fill="#2F5D50">
      <circle cx="338" cy="151" r="4.8"/>
      <circle cx="365" cy="203" r="4.8"/>
      <circle cx="387" cy="238" r="4.8"/>
      <circle cx="398" cy="249" r="4.8"/>
    </g>

    <!-- Direction arrow -->
    <line x1="365" y1="203"
          x2="386" y2="237"
          stroke="#2F5D50"
          stroke-width="2"
          marker-end="url(#arrow)"/>

    <!-- Axis labels -->
    <text x="487" y="267"
          font-family="Arial, Helvetica, sans-serif"
          font-size="15"
          fill="#6E6B63">x</text>

    <text x="410" y="94"
          font-family="Arial, Helvetica, sans-serif"
          font-size="15"
          fill="#6E6B63">L</text>
  </g>


  <!-- ========================================================= -->
  <!-- PANEL 3 — TOO LARGE -->
  <!-- ========================================================= -->

  <g>
    <!-- Title -->
    <text x="667"
          y="42"
          text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="18"
          fill="#1C1B17">
      Слишком большой шаг
    </text>

    <!-- Coordinate area -->
    <line x1="572" y1="250"
          x2="762" y2="250"
          stroke="#6E6B63"
          stroke-width="1.4"
          marker-end="url(#arrow)"/>

    <line x1="667" y1="285"
          x2="667" y2="85"
          stroke="#6E6B63"
          stroke-width="1.4"
          marker-end="url(#arrow)"/>

    <!-- Subtle grid -->
    <g stroke="#9A968C"
       stroke-width="0.7"
       opacity="0.25">
      <line x1="589" y1="220" x2="745" y2="220"/>
      <line x1="589" y1="190" x2="745" y2="190"/>
      <line x1="589" y1="160" x2="745" y2="160"/>
      <line x1="589" y1="130" x2="745" y2="130"/>

      <line x1="609" y1="105" x2="609" y2="250"/>
      <line x1="639" y1="105" x2="639" y2="250"/>
      <line x1="695" y1="105" x2="695" y2="250"/>
      <line x1="725" y1="105" x2="725" y2="250"/>
    </g>

    <!-- Convex loss function -->
    <path d="
      M 589 125
      C 609 145, 624 190, 639 220
      C 651 244, 660 250, 667 250
      C 674 250, 683 244, 695 220
      C 710 190, 725 145, 745 125"
      fill="none"
      stroke="#2F5D50"
      stroke-width="3"
      stroke-linecap="round"/>

    <!-- Oscillating optimization path -->
    <polyline
      points="
        602,145
        735,145
        612,177
        724,177
        620,208
        714,208
        628,231"
      fill="none"
      stroke="#2F5D50"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"/>

    <!-- Steps -->
    <g fill="#2F5D50">
      <circle cx="602" cy="145" r="4.8"/>
      <circle cx="735" cy="145" r="4.8"/>
      <circle cx="612" cy="177" r="4.8"/>
      <circle cx="724" cy="177" r="4.8"/>
      <circle cx="620" cy="208" r="4.8"/>
      <circle cx="714" cy="208" r="4.8"/>
      <circle cx="628" cy="231" r="4.8"/>
    </g>

    <!-- Direction arrows -->
    <line x1="648" y1="145"
          x2="680" y2="145"
          stroke="#2F5D50"
          stroke-width="2"
          marker-end="url(#arrow)"/>

    <line x1="700" y1="177"
          x2="670" y2="177"
          stroke="#2F5D50"
          stroke-width="2"
          marker-end="url(#arrow)"/>

    <!-- Axis labels -->
    <text x="754" y="267"
          font-family="Arial, Helvetica, sans-serif"
          font-size="15"
          fill="#6E6B63">x</text>

    <text x="677" y="94"
          font-family="Arial, Helvetica, sans-serif"
          font-size="15"
          fill="#6E6B63">L</text>
  </g>

  <!-- ========================================================= -->
  <!-- BOTTOM LABEL -->
  <!-- ========================================================= -->

  <text x="400"
        y="340"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15"
        fill="#6E6B63">
    Положение параметра после последовательных шагов оптимизации
  </text>

  <!-- Minimum marker -->
  <circle cx="400"
          cy="250"
          r="4"
          fill="#2F5D50"/>

  <text x="400"
        y="378"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15"
        fill="#1C1B17">
    минимум функции потерь
  </text>

  <line x1="400" y1="365"
        x2="400" y2="257"
        stroke="#9A968C"
        stroke-width="1"
        stroke-dasharray="4 4"/>

</svg>