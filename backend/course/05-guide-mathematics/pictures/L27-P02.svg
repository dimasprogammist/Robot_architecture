<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 800 450"
     width="800"
     height="450">

  <rect width="800" height="450" fill="#F4F2EC"/>

  <defs>
    <marker id="axis-arrow"
            markerWidth="10"
            markerHeight="10"
            refX="8"
            refY="5"
            orient="auto"
            markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z"
            fill="#6E6B63"/>
    </marker>
  </defs>

  <!-- Сетка -->
  <g stroke="#9A968C" stroke-width="1" opacity="0.2">

    <!-- вертикальные линии: x = -2 ... 2 -->
    <line x1="200" y1="45" x2="200" y2="405"/>
    <line x1="300" y1="45" x2="300" y2="405"/>
    <line x1="400" y1="45" x2="400" y2="405"/>
    <line x1="500" y1="45" x2="500" y2="405"/>
    <line x1="600" y1="45" x2="600" y2="405"/>

    <!-- горизонтальные линии -->
    <line x1="100" y1="135" x2="700" y2="135"/>
    <line x1="100" y1="180" x2="700" y2="180"/>
    <line x1="100" y1="225" x2="700" y2="225"/>
    <line x1="100" y1="270" x2="700" y2="270"/>
    <line x1="100" y1="315" x2="700" y2="315"/>

  </g>

  <!-- Оси -->
  <g stroke="#6E6B63"
     stroke-width="1.8"
     fill="none">

    <line x1="100"
          y1="225"
          x2="700"
          y2="225"
          marker-end="url(#axis-arrow)"/>

    <line x1="400"
          y1="405"
          x2="400"
          y2="45"
          marker-end="url(#axis-arrow)"/>

  </g>

  <!-- Подписи осей -->
  <g fill="#1C1B17"
     font-family="Arial, sans-serif"
     font-size="16">

    <text x="690" y="218">x</text>
    <text x="410" y="58">f(x)</text>

  </g>

