<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 800 450"
  width="800"
  height="450"
>
  <rect width="800" height="450" fill="#F4F2EC"/>

  <!-- Сетка -->
  <g
    stroke="#9A968C"
    stroke-width="1"
    opacity="0.22"
  >
    <line x1="100" y1="70" x2="100" y2="360"/>
    <line x1="220" y1="70" x2="220" y2="360"/>
    <line x1="340" y1="70" x2="340" y2="360"/>
    <line x1="460" y1="70" x2="460" y2="360"/>
    <line x1="580" y1="70" x2="580" y2="360"/>
    <line x1="700" y1="70" x2="700" y2="360"/>

    <line x1="80" y1="300" x2="720" y2="300"/>
    <line x1="80" y1="240" x2="720" y2="240"/>
    <line x1="80" y1="180" x2="720" y2="180"/>
    <line x1="80" y1="120" x2="720" y2="120"/>
  </g>

  <!-- Оси -->
  <g
    fill="none"
    stroke="#6E6B63"
    stroke-width="1.5"
    stroke-linecap="round"
  >
    <line x1="80" y1="360" x2="720" y2="360"/>
    <line x1="80" y1="375" x2="80" y2="55"/>

    <path d="M720 360 L710 354"/>
    <path d="M720 360 L710 366"/>

    <path d="M80 55 L74 65"/>
    <path d="M80 55 L86 65"/>
  </g>

  <!--
    Функция:
      v(t) = 0.12t² + 0.8

    Интервал:
      0 <= t <= 5

    Разбиение:
      Δt = 0.5

    Масштаб:
      x = 80 + 124t
      y = 360 - 55v

    Поэтому:
      v = 0.8  -> y = 316
      v = 3.8  -> y = 151

    Все прямоугольники рассчитаны
    непосредственно из той же функции.
  -->

  <!-- Прямоугольники левых сумм -->
  <g
    fill="#2F5D50"
    fill-opacity="0.13"
    stroke="#2F5D50"
    stroke-width="1.3"
  >

    <!-- t = 0, v = 0.8 -->
    <rect
      x="80"
      y="316"
      width="62"
      height="44"
    />

    <!-- t = 0.5, v = 0.83 -->
    <rect
      x="142"
      y="314.35"
      width="62"
      height="45.65"
    />

    <!-- t = 1, v = 0.92 -->
    <rect
      x="204"
      y="309.4"
      width="62"
      height="50.6"
    />

    <!-- t = 1.5, v = 1.07 -->
    <rect
      x="266"
      y="301.15"
      width="62"
      height="58.85"
    />

    <!-- t = 2, v = 1.28 -->
    <rect
      x="328"
      y="289.6"
      width="62"
      height="70.4"
    />

    <!-- t = 2.5, v = 1.55 -->
    <rect
      x="390"
      y="274.75"
      width="62"
      height="85.25"
    />

    <!-- t = 3, v = 1.88 -->
    <rect
      x="452"
      y="256.6"
      width="62"
      height="103.4"
    />

    <!-- t = 3.5, v = 2.27 -->
    <rect
      x="514"
      y="235.15"
      width="62"
      height="124.85"
    />

    <!-- t = 4, v = 2.72 -->
    <rect
      x="576"
      y="210.4"
      width="62"
      height="149.6"
    />

    <!-- t = 4.5, v = 3.23 -->
    <rect
      x="638"
      y="182.35"
      width="62"
      height="177.65"
    />

  </g>

  <!--
    ТОЧНАЯ КРИВАЯ

    v(t) = 0.12t² + 0.8

    Координаты:
      t=0   -> (80, 316)
      t=0.5 -> (142, 314.35)
      t=1   -> (204, 309.4)
      t=1.5 -> (266, 301.15)
      t=2   -> (328, 289.6)
      t=2.5 -> (390, 274.75)
      t=3   -> (452, 256.6)
      t=3.5 -> (514, 235.15)
      t=4   -> (576, 210.4)
      t=4.5 -> (638, 182.35)
      t=5   -> (700, 151)
  -->

  <path
    d="
      M 80 316
      C 101 315.45 122 314.85 142 314.35
      C 163 312.95 184 311.05 204 309.4
      C 225 307.15 246 304.0 266 301.15
      C 287 297.75 308 293.4 328 289.6
      C 349 285.55 370 280.0 390 274.75
      C 411 269.35 432 262.75 452 256.6
      C 473 249.9 494 242.45 514 235.15
      C 535 227.5 556 218.9 576 210.4
      C 597 201.45 618 191.9 638 182.35
      C 659 172.45 680 161.75 700 151
    "
    fill="none"
    stroke="#2F5D50"
    stroke-width="3.5"
    stroke-linecap="round"
  />

  <!-- Конечная точка -->
  <circle
    cx="700"
    cy="151"
    r="4.5"
    fill="#2F5D50"
  />

  <!-- Δt -->
  <g
    fill="none"
    stroke="#6E6B63"
    stroke-width="1.3"
  >
    <line x1="80" y1="397" x2="142" y2="397"/>

    <path d="M80 397 L88 393"/>
    <path d="M80 397 L88 401"/>

    <path d="M142 397 L134 393"/>
    <path d="M142 397 L134 401"/>
  </g>

  <text
    x="99"
    y="420"
    fill="#6E6B63"
    font-family="Arial, Helvetica, sans-serif"
    font-size="15"
  >
    Δt
  </text>

  <!-- Подписи осей -->
  <text
    x="727"
    y="366"
    fill="#1C1B17"
    font-family="Arial, Helvetica, sans-serif"
    font-size="20"
  >
    t
  </text>

  <text
    x="66"
    y="48"
    fill="#1C1B17"
    font-family="Arial, Helvetica, sans-serif"
    font-size="20"
  >
    v
  </text>

  <!-- Название функции -->
  <text
    x="625"
    y="140"
    fill="#1C1B17"
    font-family="Arial, Helvetica, sans-serif"
    font-size="17"
  >
    v(t)
  </text>

  <!-- Значения t -->
  <g
    fill="#6E6B63"
    font-family="Arial, Helvetica, sans-serif"
    font-size="15"
    text-anchor="middle"
  >
    <text x="80" y="380">0</text>
    <text x="204" y="380">1</text>
    <text x="328" y="380">2</text>
    <text x="452" y="380">3</text>
    <text x="576" y="380">4</text>
    <text x="700" y="380">5</text>
  </g>
</svg>