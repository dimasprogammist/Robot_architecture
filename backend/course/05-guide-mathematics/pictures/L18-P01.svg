<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 800 450"
     width="800"
     height="450"
     role="img"
     aria-labelledby="title desc">

  <title id="title">Геометрический смысл собственного вектора</title>
  <desc id="desc">
    Слева обычный вектор после линейного преобразования меняет направление.
    Справа собственный вектор сохраняет направление и изменяет только длину.
  </desc>

  <defs>
    <!-- Main mathematical arrow -->
    <marker id="vector-arrow"
            markerWidth="10"
            markerHeight="10"
            refX="8"
            refY="5"
            orient="auto"
            markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z"
            fill="#2F5D50"/>
    </marker>

    <!-- Muted transformed-vector arrow -->
    <marker id="muted-arrow"
            markerWidth="10"
            markerHeight="10"
            refX="8"
            refY="5"
            orient="auto"
            markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z"
            fill="#6E6B63"/>
    </marker>

    <!-- Coordinate axis arrow -->
    <marker id="axis-arrow"
            markerWidth="9"
            markerHeight="9"
            refX="7"
            refY="4.5"
            orient="auto"
            markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 9 4.5 L 0 9 Z"
            fill="#6E6B63"/>
    </marker>
  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND                                        -->
  <!-- ================================================= -->

  <rect width="800"
        height="450"
        fill="#F4F2EC"/>


  <!-- ================================================= -->
  <!-- LEFT: ORDINARY VECTOR                            -->
  <!-- ================================================= -->

  <!-- Title -->
  <text x="200"
        y="38"
        text-anchor="middle"
        fill="#1C1B17"
        font-family="Arial, Helvetica, sans-serif"
        font-size="21"
        font-weight="600">
    Обычный вектор
  </text>

  <!-- Grid -->
  <g stroke="#9A968C"
     stroke-width="1"
     opacity="0.25">

    <line x1="50" y1="75" x2="50" y2="375"/>
    <line x1="100" y1="75" x2="100" y2="375"/>
    <line x1="150" y1="75" x2="150" y2="375"/>
    <line x1="200" y1="75" x2="200" y2="375"/>
    <line x1="250" y1="75" x2="250" y2="375"/>
    <line x1="300" y1="75" x2="300" y2="375"/>
    <line x1="350" y1="75" x2="350" y2="375"/>

    <line x1="25" y1="100" x2="375" y2="100"/>
    <line x1="25" y1="150" x2="375" y2="150"/>
    <line x1="25" y1="200" x2="375" y2="200"/>
    <line x1="25" y1="250" x2="375" y2="250"/>
    <line x1="25" y1="300" x2="375" y2="300"/>
    <line x1="25" y1="350" x2="375" y2="350"/>
  </g>

  <!-- Axes -->
  <g stroke="#6E6B63"
     stroke-width="2"
     fill="none">

    <line x1="25"
          y1="300"
          x2="375"
          y2="300"
          marker-end="url(#axis-arrow)"/>

    <line x1="200"
          y1="375"
          x2="200"
          y2="75"
          marker-end="url(#axis-arrow)"/>
  </g>

  <!-- Axis labels -->
  <g fill="#1C1B17"
     font-family="Arial, Helvetica, sans-serif"
     font-size="17">

    <text x="384" y="306">X</text>
    <text x="207" y="68">Y</text>
  </g>

  <!-- Origin -->
  <circle cx="200"
          cy="300"
          r="4"
          fill="#6E6B63"/>

  <!-- Original vector (1,1) -->
  <line x1="200"
        y1="300"
        x2="250"
        y2="250"
        stroke="#9A968C"
        stroke-width="4"
        stroke-linecap="round"
        marker-end="url(#muted-arrow)"/>

  <!-- Transformed vector (3,1) -->
  <line x1="200"
        y1="300"
        x2="350"
        y2="250"
        stroke="#2F5D50"
        stroke-width="5"
        stroke-linecap="round"
        marker-end="url(#vector-arrow)"/>

  <!-- Labels -->
  <g fill="#1C1B17"
     font-family="Arial, Helvetica, sans-serif"
     font-size="17">

    <text x="226" y="242">
      до
    </text>

    <text x="323" y="241">
      после
    </text>
  </g>

  <!-- Direction guide -->
  <line x1="200"
        y1="300"
        x2="250"
        y2="250"
        stroke="#9A968C"
        stroke-width="1.5"
        stroke-dasharray="6 6"
        opacity="0.7"/>


  <!-- ================================================= -->
  <!-- RIGHT: EIGENVECTOR                               -->
  <!-- ================================================= -->

  <!-- Title -->
  <text x="600"
        y="38"
        text-anchor="middle"
        fill="#1C1B17"
        font-family="Arial, Helvetica, sans-serif"
        font-size="21"
        font-weight="600">
    Собственный вектор
  </text>

  <!-- Grid -->
  <g stroke="#9A968C"
     stroke-width="1"
     opacity="0.25">

    <line x1="425" y1="75" x2="425" y2="375"/>
    <line x1="475" y1="75" x2="475" y2="375"/>
    <line x1="525" y1="75" x2="525" y2="375"/>
    <line x1="575" y1="75" x2="575" y2="375"/>
    <line x1="625" y1="75" x2="625" y2="375"/>
    <line x1="675" y1="75" x2="675" y2="375"/>
    <line x1="725" y1="75" x2="725" y2="375"/>
    <line x1="775" y1="75" x2="775" y2="375"/>

    <line x1="400" y1="100" x2="800" y2="100"/>
    <line x1="400" y1="150" x2="800" y2="150"/>
    <line x1="400" y1="200" x2="800" y2="200"/>
    <line x1="400" y1="250" x2="800" y2="250"/>
    <line x1="400" y1="300" x2="800" y2="300"/>
    <line x1="400" y1="350" x2="800" y2="350"/>
  </g>

  <!-- Axes -->
  <g stroke="#6E6B63"
     stroke-width="2"
     fill="none">

    <line x1="400"
          y1="300"
          x2="800"
          y2="300"
          marker-end="url(#axis-arrow)"/>

    <line x1="600"
          y1="375"
          x2="600"
          y2="75"
          marker-end="url(#axis-arrow)"/>
  </g>

  <!-- Axis labels -->
  <g fill="#1C1B17"
     font-family="Arial, Helvetica, sans-serif"
     font-size="17">

    <text x="787" y="306">X</text>
    <text x="607" y="68">Y</text>
  </g>

  <!-- Origin -->
  <circle cx="600"
          cy="300"
          r="4"
          fill="#6E6B63"/>

  <!-- Original eigenvector -->
  <line x1="600"
        y1="300"
        x2="675"
        y2="300"
        stroke="#9A968C"
        stroke-width="4"
        stroke-linecap="round"
        marker-end="url(#muted-arrow)"/>

  <!-- Transformed eigenvector -->
  <line x1="600"
        y1="300"
        x2="750"
        y2="300"
        stroke="#2F5D50"
        stroke-width="5"
        stroke-linecap="round"
        marker-end="url(#vector-arrow)"/>

  <!-- Direction guide -->
  <line x1="600"
        y1="300"
        x2="760"
        y2="300"
        stroke="#9A968C"
        stroke-width="1.5"
        stroke-dasharray="6 6"
        opacity="0.7"/>

  <!-- Labels -->
  <g fill="#1C1B17"
     font-family="Arial, Helvetica, sans-serif"
     font-size="17">

    <text x="642" y="287">
      до
    </text>

    <text x="720" y="287">
      после
    </text>
  </g>

</svg>