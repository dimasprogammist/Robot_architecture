<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 800 450"
     width="800"
     height="450"
     role="img"
     aria-labelledby="title desc">

  <title id="title">Разрыв функции — скачок</title>
  <desc id="desc">
    График ступенчатой функции. До точки разрыва функция имеет одно значение,
    после точки разрыва — другое. В точке изменения тарифа происходит скачок.
  </desc>

  <defs>
    <!-- Axis arrow -->
    <marker id="axis-arrow"
            markerWidth="9"
            markerHeight="9"
            refX="7"
            refY="4.5"
            orient="auto"
            markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 9 4.5 L 0 9 Z"
            fill="#6E6B63"/>
    </marker>

    <!-- Function arrow -->
    <marker id="function-arrow"
            markerWidth="10"
            markerHeight="10"
            refX="8"
            refY="5"
            orient="auto"
            markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z"
            fill="#2F5D50"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800"
        height="450"
        fill="#F4F2EC"/>


  <!-- ================================================= -->
  <!-- GRID                                              -->
  <!-- ================================================= -->

  <g stroke="#9A968C"
     stroke-width="1"
     opacity="0.22">

    <!-- Vertical grid -->
    <line x1="100" y1="70" x2="100" y2="370"/>
    <line x1="150" y1="70" x2="150" y2="370"/>
    <line x1="200" y1="70" x2="200" y2="370"/>
    <line x1="250" y1="70" x2="250" y2="370"/>
    <line x1="300" y1="70" x2="300" y2="370"/>
    <line x1="350" y1="70" x2="350" y2="370"/>
    <line x1="400" y1="70" x2="400" y2="370"/>
    <line x1="450" y1="70" x2="450" y2="370"/>
    <line x1="500" y1="70" x2="500" y2="370"/>
    <line x1="550" y1="70" x2="550" y2="370"/>
    <line x1="600" y1="70" x2="600" y2="370"/>
    <line x1="650" y1="70" x2="650" y2="370"/>
    <line x1="700" y1="70" x2="700" y2="370"/>

    <!-- Horizontal grid -->
    <line x1="75" y1="100" x2="725" y2="100"/>
    <line x1="75" y1="150" x2="725" y2="150"/>
    <line x1="75" y1="200" x2="725" y2="200"/>
    <line x1="75" y1="250" x2="725" y2="250"/>
    <line x1="75" y1="300" x2="725" y2="300"/>
    <line x1="75" y1="350" x2="725" y2="350"/>
  </g>


  <!-- ================================================= -->
  <!-- AXES                                              -->
  <!-- ================================================= -->

  <g stroke="#6E6B63"
     stroke-width="2"
     fill="none">

    <!-- X axis -->
    <line x1="75"
          y1="350"
          x2="725"
          y2="350"
          marker-end="url(#axis-arrow)"/>

    <!-- Y axis -->
    <line x1="100"
          y1="370"
          x2="100"
          y2="65"
          marker-end="url(#axis-arrow)"/>
  </g>


  <!-- Axis labels -->
  <g fill="#1C1B17"
     font-family="Arial, Helvetica, sans-serif"
     font-size="18">

    <text x="738" y="356">x</text>
    <text x="107" y="58">f(x)</text>
  </g>


  <!-- ================================================= -->
  <!-- STEP FUNCTION                                     -->
  <!-- ================================================= -->

  <!-- Lower price segment -->
  <line x1="125"
        y1="275"
        x2="425"
        y2="275"
        stroke="#2F5D50"
        stroke-width="5"
        stroke-linecap="round"/>

  <!-- Vertical jump -->
  <line x1="425"
        y1="275"
        x2="425"
        y2="150"
        stroke="#2F5D50"
        stroke-width="5"
        stroke-linecap="round"/>

  <!-- Higher price segment -->
  <line x1="425"
        y1="150"
        x2="675"
        y2="150"
        stroke="#2F5D50"
        stroke-width="5"
        stroke-linecap="round"
        marker-end="url(#function-arrow)"/>


  <!-- ================================================= -->
  <!-- DISCONTINUITY POINTS                              -->
  <!-- ================================================= -->

  <!-- Open point: value from the left is not taken -->
  <circle cx="425"
          cy="275"
          r="7"
          fill="#F4F2EC"
          stroke="#2F5D50"
          stroke-width="3"/>

  <!-- Closed point: new price is taken -->
  <circle cx="425"
          cy="150"
          r="7"
          fill="#2F5D50"/>


  <!-- ================================================= -->
  <!-- BREAK POINT                                       -->
  <!-- ================================================= -->

  <line x1="425"
        y1="350"
        x2="425"
        y2="365"
        stroke="#6E6B63"
        stroke-width="2"/>

  <text x="425"
        y="395"
        text-anchor="middle"
        fill="#6E6B63"
        font-family="Arial, Helvetica, sans-serif"
        font-size="16">
    точка разрыва
  </text>


  <!-- ================================================= -->
  <!-- EXPLANATORY LABEL                                 -->
  <!-- ================================================= -->

  <text x="445"
        y="235"
        fill="#1C1B17"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17">
    скачок
  </text>


  <!-- Title -->
  <text x="400"
        y="35"
        text-anchor="middle"
        fill="#1C1B17"
        font-family="Arial, Helvetica, sans-serif"
        font-size="22"
        font-weight="600">
    Разрыв функции: скачок
  </text>

</svg>