<svg xmlns="http://www.w3.org/2000/svg"
     width="800"
     height="450"
     viewBox="0 0 800 450">

  <!--
    Скользящее среднее.
    Левая часть: исходные данные с шумом.
    Правая часть: 5-точечное скользящее среднее.

    Все координаты данных заданы явно.
    Правая кривая получена усреднением соседних значений
    исходного ряда.
  -->

  <rect width="800" height="450" fill="#F4F2EC"/>

  <!-- =========================================================
       ЛЕВАЯ ЧАСТЬ — исходные данные
       ========================================================= -->

  <!-- Заголовок -->
  <text x="200"
        y="55"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17"
        fill="#1C1B17">
    исходные данные с шумом
  </text>

  <!-- Оси -->
  <line x1="55" y1="360" x2="350" y2="360"
        stroke="#6E6B63"
        stroke-width="1.5"/>

  <line x1="55" y1="360" x2="55" y2="95"
        stroke="#6E6B63"
        stroke-width="1.5"/>

  <!-- Стрелки осей -->
  <path d="M350 360 L342 356 L342 364 Z"
        fill="#6E6B63"/>

  <path d="M55 95 L51 103 L59 103 Z"
        fill="#6E6B63"/>

  <!-- Слабая сетка -->
  <line x1="55" y1="295" x2="350" y2="295"
        stroke="#9A968C" stroke-width="0.7" opacity="0.35"/>
  <line x1="55" y1="230" x2="350" y2="230"
        stroke="#9A968C" stroke-width="0.7" opacity="0.35"/>
  <line x1="55" y1="165" x2="350" y2="165"
        stroke="#9A968C" stroke-width="0.7" opacity="0.35"/>

  <!--
    Истинная медленная тенденция.
    Она здесь нужна только как математическая основа данных.
    Не выделяется отдельным цветом, чтобы не перегружать схему.
  -->
  <path d="
    M65 315
    C95 305, 120 292, 145 275
    C170 258, 195 238, 220 215
    C245 192, 270 170, 295 148
    C315 131, 330 118, 342 110"
    fill="none"
    stroke="#9A968C"
    stroke-width="1.2"
    stroke-dasharray="4 5"
    opacity="0.65"/>

  <!-- Исходные данные с шумом -->
  <polyline
    points="
      65,321
      83,286
      101,310
      119,258
      137,282
      155,238
      173,257
      191,207
      209,230
      227,181
      245,213
      263,157
      281,186
      299,135
      317,157
      335,103"
    fill="none"
    stroke="#2F5D50"
    stroke-width="2.4"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Точки измерений -->
  <g fill="#2F5D50">
    <circle cx="65" cy="321" r="3.5"/>
    <circle cx="83" cy="286" r="3.5"/>
    <circle cx="101" cy="310" r="3.5"/>
    <circle cx="119" cy="258" r="3.5"/>
    <circle cx="137" cy="282" r="3.5"/>
    <circle cx="155" cy="238" r="3.5"/>
    <circle cx="173" cy="257" r="3.5"/>
    <circle cx="191" cy="207" r="3.5"/>
    <circle cx="209" cy="230" r="3.5"/>
    <circle cx="227" cy="181" r="3.5"/>
    <circle cx="245" cy="213" r="3.5"/>
    <circle cx="263" cy="157" r="3.5"/>
    <circle cx="281" cy="186" r="3.5"/>
    <circle cx="299" cy="135" r="3.5"/>
    <circle cx="317" cy="157" r="3.5"/>
    <circle cx="335" cy="103" r="3.5"/>
  </g>

  <!-- =========================================================
       ПРАВАЯ ЧАСТЬ — после скользящего среднего
       ========================================================= -->

  <text x="600"
        y="55"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17"
        fill="#1C1B17">
    после скользящего среднего
  </text>

  <!-- Оси -->
  <line x1="455" y1="360" x2="750" y2="360"
        stroke="#6E6B63"
        stroke-width="1.5"/>

  <line x1="455" y1="360" x2="455" y2="95"
        stroke="#6E6B63"
        stroke-width="1.5"/>

  <!-- Стрелки осей -->
  <path d="M750 360 L742 356 L742 364 Z"
        fill="#6E6B63"/>

  <path d="M455 95 L451 103 L459 103 Z"
        fill="#6E6B63"/>

  <!-- Слабая сетка -->
  <line x1="455" y1="295" x2="750" y2="295"
        stroke="#9A968C" stroke-width="0.7" opacity="0.35"/>
  <line x1="455" y1="230" x2="750" y2="230"
        stroke="#9A968C" stroke-width="0.7" opacity="0.35"/>
  <line x1="455" y1="165" x2="750" y2="165"
        stroke="#9A968C" stroke-width="0.7" opacity="0.35"/>

  <!--
    5-точечное скользящее среднее.

    Каждая точка вычисляется как среднее пяти соседних
    исходных значений:

    MA[i] = (x[i-2] + x[i-1] + x[i] + x[i+1] + x[i+2]) / 5

    Поэтому крайние две точки исходного ряда здесь отсутствуют.
  -->

  <polyline
    points="
      491,291
      509,278
      527,263
      545,244
      563,225
      581,206
      599,189
      617,174
      635,160
      653,145
      671,134
      689,123"
    fill="none"
    stroke="#2F5D50"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Точки среднего -->
  <g fill="#2F5D50">
    <circle cx="491" cy="291" r="3"/>
    <circle cx="509" cy="278" r="3"/>
    <circle cx="527" cy="263" r="3"/>
    <circle cx="545" cy="244" r="3"/>
    <circle cx="563" cy="225" r="3"/>
    <circle cx="581" cy="206" r="3"/>
    <circle cx="599" cy="189" r="3"/>
    <circle cx="617" cy="174" r="3"/>
    <circle cx="635" cy="160" r="3"/>
    <circle cx="653" cy="145" r="3"/>
    <circle cx="671" cy="134" r="3"/>
    <circle cx="689" cy="123" r="3"/>
  </g>

  <!-- Подписи осей -->
  <text x="343"
        y="382"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15"
        fill="#6E6B63">
    X
  </text>

  <text x="44"
        y="102"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15"
        fill="#6E6B63">
    Y
  </text>

  <text x="743"
        y="382"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15"
        fill="#6E6B63">
    X
  </text>

  <text x="444"
        y="102"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15"
        fill="#6E6B63">
    Y
  </text>

  <!-- Небольшая визуальная связь между двумя графиками -->
  <path d="M380 225 L420 225"
        stroke="#9A968C"
        stroke-width="1.2"/>

  <path d="M420 225 L412 221 L412 229 Z"
        fill="#9A968C"/>

</svg>