<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 800 450"
     width="800"
     height="450">

  <rect width="800" height="450" fill="#F4F2EC"/>

  <!-- ===================================================== -->
  <!-- Единичная окружность                                  -->
  <!-- Центр O = (400, 255), радиус = 150                    -->
  <!-- ===================================================== -->

  <circle cx="400"
          cy="255"
          r="150"
          fill="none"
          stroke="#2F5D50"
          stroke-width="3"/>


  <!-- ===================================================== -->
  <!-- Координатные оси                                      -->
  <!-- ===================================================== -->

  <!-- X -->
  <line x1="100"
        y1="255"
        x2="700"
        y2="255"
        stroke="#6E6B63"
        stroke-width="2"/>

  <polygon points="700,255 682,247 682,263"
           fill="#6E6B63"/>

  <!-- Y -->
  <line x1="400"
        y1="410"
        x2="400"
        y2="80"
        stroke="#6E6B63"
        stroke-width="2"/>

  <polygon points="400,80 392,98 408,98"
           fill="#6E6B63"/>


  <!-- ===================================================== -->
  <!-- Радиус под углом θ                                   -->
  <!-- Точка P соответствует примерно θ = 38°               -->
  <!-- ===================================================== -->

  <line x1="400"
        y1="255"
        x2="518.2"
        y2="163.0"
        stroke="#2F5D50"
        stroke-width="4"
        stroke-linecap="round"/>


  <!-- ===================================================== -->
  <!-- Проекция точки на ось X                               -->
  <!-- ===================================================== -->

  <line x1="518.2"
        y1="163.0"
        x2="518.2"
        y2="255"
        stroke="#6E6B63"
        stroke-width="1.8"
        stroke-dasharray="7 6"/>


  <!-- ===================================================== -->
  <!-- Проекция точки на ось Y                               -->
  <!-- ===================================================== -->

  <line x1="518.2"
        y1="163.0"
        x2="400"
        y2="163.0"
        stroke="#6E6B63"
        stroke-width="1.8"
        stroke-dasharray="7 6"/>


  <!-- ===================================================== -->
  <!-- Дуга угла θ                                          -->
  <!-- ===================================================== -->

  <path d="M 450 255
           A 50 50 0 0 0 439.4 224.2"
        fill="none"
        stroke="#6E6B63"
        stroke-width="2"/>


  <!-- ===================================================== -->
  <!-- Точка на окружности                                   -->
  <!-- ===================================================== -->

  <circle cx="518.2"
          cy="163.0"
          r="6"
          fill="#2F5D50"/>


  <!-- ===================================================== -->
  <!-- Центр                                                 -->
  <!-- ===================================================== -->

  <circle cx="400"
          cy="255"
          r="4"
          fill="#6E6B63"/>


  <!-- ===================================================== -->
  <!-- Подписи осей                                          -->
  <!-- ===================================================== -->

  <text x="714"
        y="262"
        fill="#1C1B17"
        font-family="Arial, Helvetica, sans-serif"
        font-size="20"
        font-style="italic">
    x
  </text>

  <text x="410"
        y="72"
        fill="#1C1B17"
        font-family="Arial, Helvetica, sans-serif"
        font-size="20"
        font-style="italic">
    y
  </text>


  <!-- ===================================================== -->
  <!-- Центр                                                 -->
  <!-- ===================================================== -->

  <text x="378"
        y="280"
        fill="#6E6B63"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15">
    O
  </text>


  <!-- ===================================================== -->
  <!-- Точка                                                 -->
  <!-- ===================================================== -->

  <text x="532"
        y="157"
        fill="#1C1B17"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17">
    (cos θ, sin θ)
  </text>


  <!-- ===================================================== -->
  <!-- Подпись угла                                          -->
  <!-- ===================================================== -->

  <text x="444"
        y="218"
        fill="#1C1B17"
        font-family="Arial, Helvetica, sans-serif"
        font-size="18"
        font-style="italic">
    θ
  </text>


  <!-- ===================================================== -->
  <!-- Подписи проекций                                     -->
  <!-- ===================================================== -->

  <text x="452"
        y="275"
        fill="#6E6B63"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15">
    cos θ
  </text>

  <text x="527"
        y="212"
        fill="#6E6B63"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15">
    sin θ
  </text>


  <!-- ===================================================== -->
  <!-- Радиус                                                -->
  <!-- ===================================================== -->

  <text x="448"
        y="190"
        fill="#2F5D50"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15"
        font-style="italic">
    r = 1
  </text>


  <!-- ===================================================== -->
  <!-- Заголовок                                             -->
  <!-- ===================================================== -->

  <text x="400"
        y="35"
        text-anchor="middle"
        fill="#1C1B17"
        font-family="Arial, Helvetica, sans-serif"
        font-size="21"
        font-weight="600">
    Единичная окружность
  </text>

</svg>