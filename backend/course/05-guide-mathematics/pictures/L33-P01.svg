  <!-- Subtle grid -->
  <g stroke="#9A968C" stroke-width="1" opacity="0.18">
    <line x1="90" y1="100" x2="720" y2="100"/>
    <line x1="90" y1="160" x2="720" y2="160"/>
    <line x1="90" y1="220" x2="720" y2="220"/>
    <line x1="90" y1="280" x2="720" y2="280"/>
    <line x1="90" y1="340" x2="720" y2="340"/>

    <line x1="195" y1="70" x2="195" y2="360"/>
    <line x1="300" y1="70" x2="300" y2="360"/>
    <line x1="405" y1="70" x2="405" y2="360"/>
    <line x1="510" y1="70" x2="510" y2="360"/>
    <line x1="615" y1="70" x2="615" y2="360"/>
  </g>

  <!-- Axes -->
