  <!-- Measured values: trend + noise -->
  <g fill="#2F5D50">

    <circle cx="105" cy="322" r="4.5"/>
    <circle cx="125" cy="337" r="4.5"/>
    <circle cx="145" cy="305" r="4.5"/>
    <circle cx="165" cy="318" r="4.5"/>
    <circle cx="185" cy="286" r="4.5"/>
    <circle cx="205" cy="299" r="4.5"/>
    <circle cx="225" cy="267" r="4.5"/>
    <circle cx="245" cy="286" r="4.5"/>
    <circle cx="265" cy="250" r="4.5"/>
    <circle cx="285" cy="271" r="4.5"/>
    <circle cx="305" cy="235" r="4.5"/>
    <circle cx="325" cy="252" r="4.5"/>
    <circle cx="345" cy="219" r="4.5"/>
    <circle cx="365" cy="238" r="4.5"/>
    <circle cx="385" cy="205" r="4.5"/>
    <circle cx="405" cy="222" r="4.5"/>
    <circle cx="425" cy="190" r="4.5"/>
    <circle cx="445" cy="208" r="4.5"/>
    <circle cx="465" cy="177" r="4.5"/>
    <circle cx="485" cy="193" r="4.5"/>
    <circle cx="505" cy="164" r="4.5"/>
    <circle cx="525" cy="180" r="4.5"/>
    <circle cx="545" cy="151" r="4.5"/>
    <circle cx="565" cy="168" r="4.5"/>
    <circle cx="585" cy="139" r="4.5"/>
    <circle cx="605" cy="151" r="4.5"/>
    <circle cx="625" cy="123" r="4.5"/>
    <circle cx="645" cy="137" r="4.5"/>
