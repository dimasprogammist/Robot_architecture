          stroke="#2F5D50"
          stroke-width="4"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Data -->
    <g fill="#2F5D50">
      <circle cx="575" cy="270" r="5.5"/>
      <circle cx="605" cy="260" r="5.5"/>
      <circle cx="635" cy="220" r="5.5"/>
      <circle cx="665" cy="210" r="5.5"/>
      <circle cx="695" cy="180" r="5.5"/>
      <circle cx="725" cy="165" r="5.5"/>
    </g>

    <text x="745" y="338"
          font-family="Arial, Helvetica, sans-serif"
          font-size="16"
          fill="#1C1B17">x</text>
    <text x="548" y="130"
          font-family="Arial, Helvetica, sans-serif"
          font-size="16"
          fill="#1C1B17">y</text>
  </g>
</svg>