      <line x1="305" y1="320" x2="500" y2="320"/>
      <line x1="305" y1="325" x2="305" y2="135"/>
    </g>
    <path d="M500 320 L491 315 L491 325 Z" fill="#6E6B63"/>
    <path d="M305 135 L300 144 L310 144 Z" fill="#6E6B63"/>

    <!-- Good model -->
    <path d="M315 285
             C345 270, 365 245, 390 225
             C415 205, 440 195, 465 180
             C478 172, 488 162, 495 150"
          fill="none"
          stroke="#2F5D50"
          stroke-width="4"
          stroke-linecap="round"/>

    <!-- Data -->
    <g fill="#2F5D50">
      <circle cx="325" cy="278" r="5.5"/>
      <circle cx="355" cy="258" r="5.5"/>
      <circle cx="385" cy="245" r="5.5"/>
      <circle cx="415" cy="215" r="5.5"/>
      <circle cx="445" cy="205" r="5.5"/>
      <circle cx="475" cy="175" r="5.5"/>
    </g>

    <text x="495" y="338"
          font-family="Arial, Helvetica, sans-serif"
          font-size="16"
