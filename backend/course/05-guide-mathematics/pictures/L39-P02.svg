    <path d="M750 320 L741 315 L741 325 Z" fill="#6E6B63"/>
    <path d="M555 135 L550 144 L560 144 Z" fill="#6E6B63"/>

    <!-- Overfitted curve -->
    <path d="M565 285
             C575 240, 580 270, 590 250
             C600 230, 600 270, 610 260
             C620 250, 620 205, 630 220
             C640 235, 640 195, 650 205
             C660 215, 665 245, 675 225
             C685 205, 690 165, 700 185
