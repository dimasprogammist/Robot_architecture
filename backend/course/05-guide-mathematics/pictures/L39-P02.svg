    <text x="298" y="130"
          font-family="Arial, Helvetica, sans-serif"
          font-size="16"
          fill="#1C1B17">y</text>
  </g>

  <!-- Panel 3 -->
  <g>
    <rect x="535" y="75" width="230" height="290" rx="8"
