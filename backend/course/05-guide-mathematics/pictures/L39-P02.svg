    <text x="650" y="105"
          text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="18"
          fill="#1C1B17">
      Переобучение
    </text>

    <!-- Grid -->
    <g stroke="#9A968C" stroke-width="1" opacity="0.22">
      <line x1="565" y1="145" x2="565" y2="320"/>
      <line x1="610" y1="145" x2="610" y2="320"/>
      <line x1="655" y1="145" x2="655" y2="320"/>
      <line x1="700" y1="145" x2="700" y2="320"/>
      <line x1="745" y1="145" x2="745" y2="320"/>
      <line x1="545" y1="190" x2="755" y2="190"/>
      <line x1="545" y1="235" x2="755" y2="235"/>
      <line x1="545" y1="280" x2="755" y2="280"/>
    </g>

    <!-- Axes -->
    <g stroke="#6E6B63" stroke-width="1.8" fill="none">
