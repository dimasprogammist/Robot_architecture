<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#F4F2EC"/>

  <text x="400" y="42"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="24"
        fill="#1C1B17">
    Переобучение
  </text>

  <!-- Panel 1 -->
  <g>
    <rect x="35" y="75" width="230" height="290" rx="8"
          fill="#FCFBF8" stroke="#ECE9E0"/>

    <text x="150" y="105"
          text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="18"
          fill="#1C1B17">
      Недообучение
    </text>

    <!-- Grid -->
    <g stroke="#9A968C" stroke-width="1" opacity="0.22">
      <line x1="65" y1="145" x2="65" y2="320"/>
      <line x1="110" y1="145" x2="110" y2="320"/>
      <line x1="155" y1="145" x2="155" y2="320"/>
      <line x1="200" y1="145" x2="200" y2="320"/>
      <line x1="245" y1="145" x2="245" y2="320"/>
      <line x1="45" y1="190" x2="255" y2="190"/>
      <line x1="45" y1="235" x2="255" y2="235"/>
      <line x1="45" y1="280" x2="255" y2="280"/>
    </g>

    <!-- Axes -->
    <g stroke="#6E6B63" stroke-width="1.8" fill="none">
      <line x1="55" y1="320" x2="250" y2="320"/>
      <line x1="55" y1="325" x2="55" y2="135"/>
    </g>
    <path d="M250 320 L241 315 L241 325 Z" fill="#6E6B63"/>
    <path d="M55 135 L50 144 L60 144 Z" fill="#6E6B63"/>

    <!-- Underfitted line -->
    <line x1="65" y1="285" x2="240" y2="205"
          stroke="#2F5D50"
          stroke-width="4"
          stroke-linecap="round"/>

    <!-- Data -->
    <g fill="#2F5D50">
      <circle cx="75" cy="270" r="5.5"/>
      <circle cx="105" cy="250" r="5.5"/>
      <circle cx="135" cy="265" r="5.5"/>
      <circle cx="165" cy="220" r="5.5"/>
      <circle cx="195" cy="235" r="5.5"/>
      <circle cx="225" cy="185" r="5.5"/>
    </g>

    <text x="245" y="338"
          font-family="Arial, Helvetica, sans-serif"
          font-size="16"
          fill="#1C1B17">x</text>
    <text x="48" y="130"
          font-family="Arial, Helvetica, sans-serif"
          font-size="16"
          fill="#1C1B17">y</text>
  </g>

  <!-- Panel 2 -->
  <g>
    <rect x="285" y="75" width="230" height="290" rx="8"
