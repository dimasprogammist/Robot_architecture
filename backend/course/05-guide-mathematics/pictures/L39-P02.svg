    <!-- Grid -->
    <g stroke="#9A968C" stroke-width="1" opacity="0.22">
      <line x1="315" y1="145" x2="315" y2="320"/>
      <line x1="360" y1="145" x2="360" y2="320"/>
      <line x1="405" y1="145" x2="405" y2="320"/>
      <line x1="450" y1="145" x2="450" y2="320"/>
      <line x1="495" y1="145" x2="495" y2="320"/>
      <line x1="295" y1="190" x2="505" y2="190"/>
      <line x1="295" y1="235" x2="505" y2="235"/>
      <line x1="295" y1="280" x2="505" y2="280"/>
