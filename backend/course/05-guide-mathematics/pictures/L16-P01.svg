<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 800 450"
     width="800"
     height="450"
     role="img"
     aria-labelledby="title desc">

  <title id="title">Линейная независимость векторов</title>
  <desc id="desc">
    Слева показаны независимые векторы (1,0) и (0,1).
    Справа показаны зависимые векторы (1,2) и (2,4),
    лежащие на одном направлении.
  </desc>

  <defs>
    <!-- Arrow marker aligned automatically with the vector direction -->
    <marker id="arrow"
            markerWidth="10"
            markerHeight="10"
            refX="8"
            refY="5"
            orient="auto"
            markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z"
            fill="#2F5D50"/>
    </marker>

    <marker id="axis-arrow"
            markerWidth="9"
            markerHeight="9"
            refX="7"
            refY="4.5"
            orient="auto"
            markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 9 4.5 L 0 9 Z"
            fill="#6E6B63"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800"
        height="450"
        fill="#F4F2EC"/>


  <!-- ================================================= -->
  <!-- LEFT: INDEPENDENT VECTORS                        -->
  <!-- ================================================= -->

  <!-- Grid -->
  <g stroke="#9A968C"
     stroke-width="1"
     opacity="0.28">

    <line x1="75" y1="75" x2="75" y2="375"/>
    <line x1="125" y1="75" x2="125" y2="375"/>
    <line x1="175" y1="75" x2="175" y2="375"/>
    <line x1="225" y1="75" x2="225" y2="375"/>
    <line x1="275" y1="75" x2="275" y2="375"/>
    <line x1="325" y1="75" x2="325" y2="375"/>

    <line x1="50" y1="100" x2="350" y2="100"/>
    <line x1="50" y1="150" x2="350" y2="150"/>
    <line x1="50" y1="200" x2="350" y2="200"/>
    <line x1="50" y1="250" x2="350" y2="250"/>
    <line x1="50" y1="300" x2="350" y2="300"/>
    <line x1="50" y1="350" x2="350" y2="350"/>
  </g>

  <!-- Axes -->
  <g stroke="#6E6B63"
     stroke-width="2"
     fill="none">

    <line x1="50"
          y1="300"
          x2="350"
          y2="300"
          marker-end="url(#axis-arrow)"/>

    <line x1="200"
          y1="375"
          x2="200"
          y2="75"
          marker-end="url(#axis-arrow)"/>
  </g>

  <!-- Axis labels -->
  <g fill="#1C1B17"
     font-family="Arial, Helvetica, sans-serif"
     font-size="18">

    <text x="362" y="306">X</text>
    <text x="207" y="68">Y</text>
  </g>

  <!-- Origin -->
  <circle cx="200"
          cy="300"
          r="4"
          fill="#6E6B63"/>

  <!-- Vector (1,0) -->
  <line x1="200"
        y1="300"
        x2="275"
        y2="300"
        stroke="#2F5D50"
        stroke-width="5"
        stroke-linecap="round"
        marker-end="url(#arrow)"/>

  <!-- Vector (0,1) -->
  <line x1="200"
        y1="300"
        x2="200"
        y2="225"
        stroke="#2F5D50"
        stroke-width="5"
        stroke-linecap="round"
        marker-end="url(#arrow)"/>

  <!-- Vector labels -->
  <g fill="#1C1B17"
     font-family="Arial, Helvetica, sans-serif"
     font-size="18">

    <text x="280" y="292">(1, 0)</text>
    <text x="211" y="218">(0, 1)</text>
  </g>

  <!-- Section title -->
  <text x="200"
        y="35"
        text-anchor="middle"
        fill="#1C1B17"
        font-family="Arial, Helvetica, sans-serif"
        font-size="22"
        font-weight="600">
    Независимые
  </text>


  <!-- ================================================= -->
  <!-- RIGHT: DEPENDENT VECTORS                         -->
  <!-- ================================================= -->

  <!-- Grid -->
  <g stroke="#9A968C"
     stroke-width="1"
     opacity="0.28">

    <line x1="450" y1="75" x2="450" y2="375"/>
    <line x1="500" y1="75" x2="500" y2="375"/>
    <line x1="550" y1="75" x2="550" y2="375"/>
    <line x1="600" y1="75" x2="600" y2="375"/>
    <line x1="650" y1="75" x2="650" y2="375"/>
    <line x1="700" y1="75" x2="700" y2="375"/>
    <line x1="750" y1="75" x2="750" y2="375"/>

    <line x1="425" y1="100" x2="775" y2="100"/>
    <line x1="425" y1="150" x2="775" y2="150"/>
    <line x1="425" y1="200" x2="775" y2="200"/>
    <line x1="425" y1="250" x2="775" y2="250"/>
    <line x1="425" y1="300" x2="775" y2="300"/>
    <line x1="425" y1="350" x2="775" y2="350"/>
  </g>

  <!-- Axes -->
  <g stroke="#6E6B63"
     stroke-width="2"
     fill="none">

    <line x1="425"
          y1="300"
          x2="775"
          y2="300"
          marker-end="url(#axis-arrow)"/>

    <line x1="600"
          y1="375"
          x2="600"
          y2="75"
          marker-end="url(#axis-arrow)"/>
  </g>

  <!-- Axis labels -->
  <g fill="#1C1B17"
     font-family="Arial, Helvetica, sans-serif"
     font-size="18">

    <text x="787" y="306">X</text>
    <text x="607" y="68">Y</text>
  </g>

  <!-- Origin -->
  <circle cx="600"
          cy="300"
          r="4"
          fill="#6E6B63"/>

  <!-- Common direction line -->
  <line x1="485"
        y1="415"
        x2="715"
        y2="75"
        stroke="#9A968C"
        stroke-width="2"
        stroke-dasharray="7 7"
        opacity="0.75"/>

  <!-- Vector (1,2) -->
  <line x1="600"
        y1="300"
        x2="650"
        y2="200"
        stroke="#2F5D50"
        stroke-width="5"
        stroke-linecap="round"
        marker-end="url(#arrow)"/>

  <!-- Vector (2,4) -->
  <line x1="600"
        y1="300"
        x2="700"
        y2="100"
        stroke="#2F5D50"
        stroke-width="5"
        stroke-linecap="round"
        marker-end="#0072B2"/>

  <!-- Vector labels -->
  <g fill="#1C1B17"
     font-family="Arial, Helvetica, sans-serif"
     font-size="18">

    <text x="657" y="197">(1, 2)</text>
    <text x="706" y="96">(2, 4)</text>
  </g>

  <!-- Section title -->
  <text x="600"
        y="35"
        text-anchor="middle"
        fill="#1C1B17"
        font-family="Arial, Helvetica, sans-serif"
        font-size="22"
        font-weight="600">
    Зависимые
  </text>

</svg>