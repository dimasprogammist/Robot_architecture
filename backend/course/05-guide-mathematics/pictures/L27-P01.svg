<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">

  <rect width="800" height="450" fill="#F4F2EC"/>

  <defs>
    <marker id="axis-arrow"
            markerWidth="9"
            markerHeight="9"
            refX="7"
            refY="4.5"
            orient="auto"
            markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#6E6B63"/>
    </marker>

    <marker id="tangent-arrow"
            markerWidth="10"
            markerHeight="10"
            refX="8"
            refY="5"
            orient="auto"
            markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#0072B2"/>
    </marker>
  </defs>


  <!-- ==================== СЕТКА ==================== -->

  <g stroke="#9A968C" stroke-width="1" opacity="0.18">

    <line x1="80"  y1="50" x2="80"  y2="420"/>
    <line x1="135" y1="50" x2="135" y2="420"/>
    <line x1="190" y1="50" x2="190" y2="420"/>
    <line x1="245" y1="50" x2="245" y2="420"/>
    <line x1="300" y1="50" x2="300" y2="420"/>
    <line x1="355" y1="50" x2="355" y2="420"/>
    <line x1="410" y1="50" x2="410" y2="420"/>
    <line x1="465" y1="50" x2="465" y2="420"/>
    <line x1="520" y1="50" x2="520" y2="420"/>
    <line x1="575" y1="50" x2="575" y2="420"/>
    <line x1="630" y1="50" x2="630" y2="420"/>
    <line x1="685" y1="50" x2="685" y2="420"/>
    <line x1="740" y1="50" x2="740" y2="420"/>

    <line x1="50" y1="75"  x2="750" y2="75"/>
    <line x1="50" y1="130" x2="750" y2="130"/>
    <line x1="50" y1="185" x2="750" y2="185"/>
    <line x1="50" y1="240" x2="750" y2="240"/>
    <line x1="50" y1="295" x2="750" y2="295"/>
    <line x1="50" y1="350" x2="750" y2="350"/>
    <line x1="50" y1="405" x2="750" y2="405"/>

  </g>


  <!-- ==================== ОСИ ==================== -->

  <!-- x-axis -->
  <line
    x1="60" y1="350"
    x2="750" y2="350"
    stroke="#6E6B63"
    stroke-width="1.5"
    marker-end="url(#axis-arrow)"
  />

  <!-- y-axis -->
  <line
    x1="300" y1="420"
    x2="300" y2="40"
    stroke="#6E6B63"
    stroke-width="1.5"
    marker-end="url(#axis-arrow)"
  />

  <text
    x="755"
    y="345"
    font-family="Arial, sans-serif"
    font-size="16"
    fill="#1C1B17">
    x
  </text>

  <text
    x="290"
    y="35"
    font-family="Arial, sans-serif"
    font-size="16"
    fill="#1C1B17">
    y
  </text>


  <!--
    СИСТЕМА КООРДИНАТ

    Начало:
      O = (300, 350)

    Масштаб:
      1 единица = 55 px

    Преобразование:
      SVG_X = 300 + 55*x
      SVG_Y = 350 - 55*y


    ФУНКЦИЯ:

      y = x²


    ТОЧКА КАСАНИЯ:

      x = 1
      y = 1

      SVG:
      X = 300 + 55 = 355
      Y = 350 - 55 = 295


    ПРОИЗВОДНАЯ:

      y' = 2x

      при x = 1:

      y' = 2


    КАСАТЕЛЬНАЯ:

      y = 2x - 1


    ВАЖНО:

      y = x²
      y = 2x - 1

      Разность:

      x² - (2x - 1)
      = x² - 2x + 1
      = (x - 1)²

      Поэтому касательная касается параболы
      только в x = 1 и нигде её не пересекает.
  -->


  <!-- ==================== ПАРАБОЛА y = x² ==================== -->

  <!--
    Реальные точки y = x².

    x = -2  -> y = 4
    x = -1.8 -> y = 3.24
    x = -1.6 -> y = 2.56
    x = -1.4 -> y = 1.96
    x = -1.2 -> y = 1.44
    x = -1   -> y = 1
    x = -0.8 -> y = 0.64
    x = -0.6 -> y = 0.36
    x = -0.4 -> y = 0.16
    x = -0.2 -> y = 0.04
    x = 0    -> y = 0
    x = 0.2  -> y = 0.04
    x = 0.4  -> y = 0.16
    x = 0.6  -> y = 0.36
    x = 0.8  -> y = 0.64
    x = 1    -> y = 1
    x = 1.2  -> y = 1.44
    x = 1.4  -> y = 1.96
    x = 1.6  -> y = 2.56
    x = 1.8  -> y = 3.24
    x = 2    -> y = 4
  -->

  <polyline
    points="
      190,130
      201,171.8
      212,209.2
      223,242.2
      234,270.8
      245,295
      256,314.8
      267,330.2
      278,341.2
      289,347.8
      300,350
      311,347.8
      322,341.2
      333,330.2
      344,314.8
      355,295
      366,270.8
      377,242.2
      388,209.2
      399,171.8
      410,130
    "
    fill="none"
    stroke="#2F5D50"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />


  <!-- ==================== КАСАТЕЛЬНАЯ ==================== -->

  <!--
    y = 2x - 1

    Начало:
      x = -0.5
      y = -2

      SVG = (272.5, 460)

    Конец:
      x = 1.8
      y = 2.6

      SVG = (399, 207)

    Линия проходит точно через:
      (1, 1)
      SVG = (355, 295)
  -->

  <line
    x1="272.5"
    y1="460"
    x2="399"
    y2="207"
    stroke="#0072B2"
    stroke-width="3"
    stroke-linecap="round"
    marker-end="url(#tangent-arrow)"
  />


  <!-- ==================== ТОЧКА КАСАНИЯ ==================== -->

  <!-- (1, 1) -->

  <circle
    cx="355"
    cy="295"
    r="7"
    fill="#0072B2"
    stroke="#F4F2EC"
    stroke-width="3"
  />


  <!-- ==================== ПОДПИСИ ==================== -->

  <text
    x="415"
    y="125"
    font-family="Arial, sans-serif"
    font-size="16"
    fill="#2F5D50">
    f(x)
  </text>

  <text
    x="395"
    y="205"
    font-family="Arial, sans-serif"
    font-size="16"
    fill="#0072B2">
    касательная
  </text>

  <text
    x="370"
    y="285"
    font-family="Arial, sans-serif"
    font-size="15"
    fill="#1C1B17">
    точка касания
  </text>

</svg>