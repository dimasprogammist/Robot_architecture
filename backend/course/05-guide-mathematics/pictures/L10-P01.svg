<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 800 450"
     width="800"
     height="450">

  <rect width="800" height="450" fill="#F4F2EC"/>

  <!-- ===================================================== -->
  <!-- Лёгкая пространственная сетка                         -->
  <!-- ===================================================== -->

  <g stroke="#9A968C" stroke-width="0.8" opacity="0.16">

    <!-- направления X -->
    <line x1="120" y1="450" x2="300" y2="330"/>
    <line x1="175" y1="450" x2="355" y2="330"/>
    <line x1="230" y1="450" x2="410" y2="330"/>
    <line x1="285" y1="450" x2="465" y2="330"/>
    <line x1="340" y1="450" x2="520" y2="330"/>
    <line x1="395" y1="450" x2="575" y2="330"/>
    <line x1="450" y1="450" x2="630" y2="330"/>

    <!-- направления Y -->
    <line x1="120" y1="450" x2="670" y2="450"/>
    <line x1="150" y1="430" x2="700" y2="430"/>
    <line x1="180" y1="410" x2="730" y2="410"/>
    <line x1="210" y1="390" x2="760" y2="390"/>
    <line x1="240" y1="370" x2="790" y2="370"/>
    <line x1="270" y1="350" x2="820" y2="350"/>

  </g>


  <!-- ===================================================== -->
  <!-- Координатные оси                                      -->
  <!-- ===================================================== -->

  <!-- X -->
  <line x1="350" y1="330"
        x2="105" y2="450"
        stroke="#6E6B63"
        stroke-width="2.2"
        stroke-linecap="round"/>

  <polygon points="105,450 120,435 126,449"
           fill="#6E6B63"/>


  <!-- Y -->
  <line x1="350" y1="330"
        x2="710" y2="330"
        stroke="#6E6B63"
        stroke-width="2.2"
        stroke-linecap="round"/>

  <polygon points="710,330 692,322 692,338"
           fill="#6E6B63"/>


  <!-- Z -->
  <line x1="350" y1="330"
        x2="350" y2="70"
        stroke="#6E6B63"
        stroke-width="2.2"
        stroke-linecap="round"/>

  <polygon points="350,70 342,87 358,87"
           fill="#6E6B63"/>


  <!-- ===================================================== -->
  <!-- Основные точки                                        -->
  <!-- ===================================================== -->

  <!-- O -->
  <circle cx="350" cy="330" r="4" fill="#6E6B63"/>

  <!-- (2,0,0) -->
  <circle cx="240" cy="384" r="4" fill="#6E6B63"/>

  <!-- (0,3,0) -->
  <circle cx="515" cy="330" r="4" fill="#6E6B63"/>

  <!-- (2,3,0) -->
  <circle cx="405" cy="384" r="5" fill="#6E6B63"/>

  <!-- (2,0,4) -->
  <circle cx="240" cy="184" r="5" fill="#6E6B63"/>

  <!-- (0,0,4) -->
  <circle cx="350" cy="130" r="4" fill="#6E6B63"/>

  <!-- (0,3,4) -->
  <circle cx="515" cy="130" r="5" fill="#6E6B63"/>

  <!-- P -->
  <circle cx="405" cy="184" r="6" fill="#2F5D50"/>


  <!-- ===================================================== -->
  <!-- Исходный вектор OP                                   -->
  <!-- ===================================================== -->

  <line x1="350" y1="330"
        x2="405" y2="184"
        stroke="#2F5D50"
        stroke-width="4"
        stroke-linecap="round"/>

  <polygon points="405,184 393,202 410,208"
           fill="#2F5D50"/>


  <!-- ===================================================== -->
  <!-- P → XY                                                -->
  <!-- ===================================================== -->

  <line x1="405" y1="184"
        x2="405" y2="384"
        stroke="#6E6B63"
        stroke-width="1.8"
        stroke-dasharray="7 6"/>


  <!-- ===================================================== -->
  <!-- P → XZ                                                -->
  <!-- ===================================================== -->

  <line x1="405" y1="184"
        x2="240" y2="184"
        stroke="#6E6B63"
        stroke-width="1.8"
        stroke-dasharray="7 6"/>


  <!-- ===================================================== -->
  <!-- P → YZ                                                -->
  <!-- ===================================================== -->

  <line x1="405" y1="184"
        x2="515" y2="130"
        stroke="#6E6B63"
        stroke-width="1.8"
        stroke-dasharray="7 6"/>


  <!-- ===================================================== -->
  <!-- ПЛОСКОСТЬ XY                                          -->
  <!-- ===================================================== -->

  <!-- (2,3,0) → X -->
  <line x1="405" y1="384"
        x2="240" y2="384"
        stroke="#6E6B63"
        stroke-width="1.8"
        stroke-dasharray="7 6"/>

  <!-- (2,3,0) → Y -->
  <line x1="405" y1="384"
        x2="515" y2="330"
        stroke="#6E6B63"
        stroke-width="1.8"
        stroke-dasharray="7 6"/>


  <!-- ===================================================== -->
  <!-- ПЛОСКОСТЬ XZ                                          -->
  <!-- ===================================================== -->

  <!-- (2,0,4) → X -->
  <line x1="240" y1="184"
        x2="240" y2="384"
        stroke="#6E6B63"
        stroke-width="1.8"
        stroke-dasharray="7 6"/>


  <!-- (2,0,4) → Z -->
  <line x1="240" y1="184"
        x2="350" y2="130"
        stroke="#6E6B63"
        stroke-width="1.8"
        stroke-dasharray="7 6"/>


  <!-- ===================================================== -->
  <!-- ПЛОСКОСТЬ YZ                                          -->
  <!-- ===================================================== -->

  <!-- (0,3,4) → Y -->
  <line x1="515" y1="130"
        x2="515" y2="330"
        stroke="#6E6B63"
        stroke-width="1.8"
        stroke-dasharray="7 6"/>


  <!-- (0,3,4) → Z -->
  <line x1="515" y1="130"
        x2="350" y2="130"
        stroke="#6E6B63"
        stroke-width="1.8"
        stroke-dasharray="7 6"/>


  <!-- ===================================================== -->
  <!-- Прямой угол                                           -->
  <!-- ===================================================== -->

  <path d="M 405 354
           L 375 354
           L 375 384"
        fill="none"
        stroke="#6E6B63"
        stroke-width="1.5"/>


  <!-- ===================================================== -->
  <!-- Подписи осей                                          -->
  <!-- ===================================================== -->

  <g fill="#1C1B17"
     font-family="Arial, Helvetica, sans-serif"
     font-size="20"
     font-style="italic">

    <text x="92" y="430">x</text>
    <text x="722" y="337">y</text>
    <text x="360" y="67">z</text>

  </g>


  <!-- ===================================================== -->
  <!-- Подписи координатных точек                            -->
  <!-- ===================================================== -->

  <text x="307" y="352"
        fill="#6E6B63"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14">
    O (0,0,0)
  </text>


  <text x="205" y="405"
        fill="#6E6B63"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14">
    (2,0,0)
  </text>


  <text x="520" y="350"
        fill="#6E6B63"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14">
    (0,3,0)
  </text>


  <text x="413" y="405"
        fill="#6E6B63"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14">
    (2,3,0)
  </text>


  <text x="175" y="178"
        fill="#6E6B63"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14">
    (2,0,4)
  </text>


  <text x="300" y="122"
        fill="#6E6B63"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14">
    (0,0,4)
  </text>


  <text x="523" y="122"
        fill="#6E6B63"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14">
    (0,3,4)
  </text>


  <!-- ===================================================== -->
  <!-- Точка P                                               -->
  <!-- ===================================================== -->

  <text x="420" y="175"
        fill="#1C1B17"
        font-family="Arial, Helvetica, sans-serif"
        font-size="18">
    P (2,3,4)
  </text>


  <!-- ===================================================== -->
  <!-- Подписи плоскостей                                    -->
  <!-- ===================================================== -->

  <text x="430" y="300"
        fill="#6E6B63"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14">
    XY
  </text>

  <text x="275" y="205"
        fill="#6E6B63"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14">
    XZ
  </text>

  <text x="480" y="205"
        fill="#6E6B63"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14">
    YZ
  </text>


  <!-- ===================================================== -->
  <!-- Заголовок                                             -->
  <!-- ===================================================== -->

  <text x="400" y="40"
        text-anchor="middle"
        fill="#1C1B17"
        font-family="Arial, Helvetica, sans-serif"
        font-size="21"
        font-weight="600">
    Координаты точки в пространстве
  </text>

</svg>