<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 800 450"
     width="800"
     height="450">

  <rect width="800" height="450" fill="#F4F2EC"/>

  <!-- ==================== GRID ==================== -->

  <g stroke="#9A968C" stroke-width="0.8" opacity="0.18">

    <line x1="80" y1="70" x2="80" y2="390"/>
    <line x1="160" y1="70" x2="160" y2="390"/>
    <line x1="240" y1="70" x2="240" y2="390"/>
    <line x1="320" y1="70" x2="320" y2="390"/>
    <line x1="400" y1="70" x2="400" y2="390"/>
    <line x1="480" y1="70" x2="480" y2="390"/>
    <line x1="560" y1="70" x2="560" y2="390"/>
    <line x1="640" y1="70" x2="640" y2="390"/>
    <line x1="720" y1="70" x2="720" y2="390"/>

    <line x1="50" y1="110" x2="750" y2="110"/>
    <line x1="50" y1="170" x2="750" y2="170"/>
    <line x1="50" y1="230" x2="750" y2="230"/>
    <line x1="50" y1="290" x2="750" y2="290"/>
    <line x1="50" y1="350" x2="750" y2="350"/>

  </g>


  <!-- ==================== DIRECTION b ==================== -->

  <!-- Main direction line -->
  <line x1="110" y1="320"
        x2="690" y2="320"
        stroke="#6E6B63"
        stroke-width="2"
        stroke-linecap="round"/>

  <!-- Arrow of b -->
  <polygon points="690,320 673,312 673,328"
           fill="#6E6B63"/>


  <!-- ==================== VECTOR a ==================== -->

  <!-- Vector a -->
  <line x1="250" y1="320"
        x2="430" y2="145"
        stroke="#2F5D50"
        stroke-width="3.5"
        stroke-linecap="round"/>

  <polygon points="430,145 411,151 422,162"
           fill="#2F5D50"/>


  <!-- ==================== PROJECTION ==================== -->

  <!-- Projection of a onto b -->
  <line x1="250" y1="320"
        x2="430" y2="320"
        stroke="#2F5D50"
        stroke-width="5"
        stroke-linecap="round"/>

  <!-- Projection endpoint -->
  <circle cx="430"
          cy="320"
          r="4.5"
          fill="#2F5D50"/>


  <!-- ==================== PERPENDICULAR ==================== -->

  <!-- Perpendicular from a endpoint to b -->
  <line x1="430" y1="145"
        x2="430" y2="320"
        stroke="#6E6B63"
        stroke-width="1.8"
        stroke-dasharray="7 6"/>


  <!-- Right angle marker -->
  <path d="M 430 290
           L 400 290
           L 400 320"
        fill="none"
        stroke="#6E6B63"
        stroke-width="1.5"/>


  <!-- ==================== LABELS ==================== -->

  <g fill="#1C1B17"
     font-family="Arial, Helvetica, sans-serif"
     font-size="19"
     font-style="italic">

    <!-- a -->
    <text x="438" y="137">a</text>

    <!-- b -->
    <text x="700" y="315">b</text>

  </g>


  <!-- Projection label -->

  <text x="340"
        y="345"
        text-anchor="middle"
        fill="#2F5D50"
        font-family="Arial, Helvetica, sans-serif"
        font-size="16">
    проекция a на b
  </text>


  <!-- Perpendicular label -->

  <text x="448"
        y="235"
        fill="#6E6B63"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14">
    перпендикуляр
  </text>


  <!-- ==================== TITLE ==================== -->

  <text x="400"
        y="45"
        text-anchor="middle"
        fill="#1C1B17"
        font-family="Arial, Helvetica, sans-serif"
        font-size="21"
        font-weight="600">
    Проекция вектора a на направление b
  </text>


  <!-- ==================== FORMULA ==================== -->

  <text x="400"
        y="405"
        text-anchor="middle"
        fill="#1C1B17"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17">
    при единичном b̂:  проекция = a · b̂
  </text>

</svg>