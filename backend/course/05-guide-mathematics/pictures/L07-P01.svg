<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 800 450"
     width="800"
     height="450">

  <!-- Фон -->
  <rect width="800" height="450" fill="#F4F2EC"/>

  <!-- Сетка -->
  <g stroke="#9A968C" stroke-width="0.8" opacity="0.25">
    <!-- Вертикальные линии -->
    <line x1="80"  y1="40" x2="80"  y2="390"/>
    <line x1="160" y1="40" x2="160" y2="390"/>
    <line x1="240" y1="40" x2="240" y2="390"/>
    <line x1="320" y1="40" x2="320" y2="390"/>
    <line x1="400" y1="40" x2="400" y2="390"/>
    <line x1="480" y1="40" x2="480" y2="390"/>
    <line x1="560" y1="40" x2="560" y2="390"/>
    <line x1="640" y1="40" x2="640" y2="390"/>
    <line x1="720" y1="40" x2="720" y2="390"/>

    <!-- Горизонтальные линии -->
    <line x1="40" y1="70"  x2="760" y2="70"/>
    <line x1="40" y1="130" x2="760" y2="130"/>
    <line x1="40" y1="190" x2="760" y2="190"/>
    <line x1="40" y1="250" x2="760" y2="250"/>
    <line x1="40" y1="310" x2="760" y2="310"/>
    <line x1="40" y1="370" x2="760" y2="370"/>
  </g>

  <!-- Оси координат -->
  <g stroke="#6E6B63" stroke-width="1.4" fill="none">
    <!-- X -->
    <line x1="40" y1="250" x2="755" y2="250"/>
    <!-- Y -->
    <line x1="400" y1="390" x2="400" y2="40"/>
  </g>

  <!-- Стрелки осей -->
  <g fill="#6E6B63">
    <polygon points="755,250 744,244 744,256"/>
    <polygon points="400,40 394,51 406,51"/>
  </g>

  <!-- Подписи осей -->
  <g fill="#1C1B17"
     font-family="Arial, Helvetica, sans-serif"
     font-size="17"
     font-style="italic">
    <text x="765" y="256">x</text>
    <text x="408" y="31">f(x)</text>
  </g>

  <!-- Начало координат -->
  <text x="408"
        y="269"
        fill="#6E6B63"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14">
    O
  </text>

  <!-- График функции f(x) = x -->
  <line x1="120"
        y1="410"
        x2="680"
        y2="90"
        stroke="#2F5D50"
        stroke-width="3"
        stroke-linecap="round"/>

  <!-- Подпись функции -->
  <text x="590"
        y="110"
        fill="#2F5D50"
        font-family="Arial, Helvetica, sans-serif"
        font-size="16"
        font-style="italic">
    f(x) = x
  </text>

</svg>